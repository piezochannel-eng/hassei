    var cooling = heatCooling(state, env);
    var gain = (state.dormant || state.refractoryLeft > 0 || state.crashLeft > 0) ? 0 : heatGain(state, state.signals, env);
    var heq = gain / cooling;
    state.heat = Math.max(0, heq + (state.heat - heq) * Math.exp(-cooling * dt));

    if (state.crashLeft > 0) {
      state.crashLeft = Math.max(0, state.crashLeft - dt);
      state.heat = 100;
      if (state.crashLeft === 0) {
        state.heat = CONFIG.heat.afterCrashHeat;
        state.refractoryLeft = env.curse.refractorySeconds * env.card.refractory;
      }
    } else if (state.refractoryLeft > 0) {
      state.refractoryLeft = Math.max(0, state.refractoryLeft - dt);
    } else if (state.heat >= CONFIG.heat.stages[2]) {
      state.crashLeft = CONFIG.heat.crashSeconds;
      state.heat = 100;
      state.stats.crashes++;
      state.run.lastCrashAt = state.stats.playSeconds;
    }

    state.buffs = state.buffs.filter(function (b) { b.left -= dt; return b.left > 0; });
    state.drugs = (state.drugs || []).filter(function (d) { d.left -= dt; return d.left > 0; });
    state.apoptosisCooldown = Math.max(0, state.apoptosisCooldown - dt);
    if (state.dormant) state.stats.dormantSeconds += dt;
    // 彼の血: ときどき施設が食われる(1分に2%ほど)
    if (env.curse.devour && rand() < 0.02 * dt / 60) {
      var owned = FACILITIES.filter(function (f) { return state.counts[f.id] > 0; });
      if (owned.length) {
        var f = owned[Math.floor(rand() * owned.length)];
        state.counts[f.id] = Math.floor(state.counts[f.id] * 0.9);
        state.run.devoured = (state.run.devoured || 0) + 1;
      }
    }
    state.stats.playSeconds += dt;
    return made;
  }

  /** 開いている間の1歩。声の出現と消滅も扱う */
  function tick(state, dt, rand) {
    rand = rand || Math.random;
    var made = step(state, dt, rand);
    if (state.voice) { state.voice.left -= dt; if (state.voice.left <= 0) state.voice = null; }
    else state.nextVoiceIn -= dt;
    if (state.him) { state.him.left -= dt; if (state.him.left <= 0) state.him = null; }
    else state.nextHimIn -= dt;
    return made;
  }

  /* ============================================================
   * 物語の進み具合と、声
   * ========================================================== */
  function openZoneCount(state) {
    return BP.ZONES.filter(function (z) { return z.id !== 'g' && zoneOpen(state, z.id); }).length;
  }

  /** 0〜1。区画の解放、写本の頁、継代の回数で進む */
  function progress(state) {
    if (state.story && state.story.cleared) return 1;
    var z = Math.max(0, openZoneCount(state) - 1) / 5;
    var p = (state.story ? state.story.pages.length : 0) / CT.PAGES.length;
    var c = Math.min(state.promotions || 0, 10) / 10;
    var b = Math.min(state.trial ? state.trial.best : 0, 50) / 50;
    return Math.max(0, Math.min(1, 0.4 * z + 0.25 * p + 0.15 * c + 0.2 * b));
  }

  /** 研究所の誰かの声を出す */
  function spawnVoice(state, rand) {
    rand = rand || Math.random;
    var fx = cardFx(state);
    var curse = cursedFx(state);
    var q = CONFIG.voice;
    var rate = fx.voiceRate;
    if (curse.silence || rate <= 0) { state.nextVoiceIn = q.maxSeconds; return null; }
    var p = progress(state);
    var sp = CT.SPEAKERS[Math.floor(rand() * CT.SPEAKERS.length)];
    var pool = sp.lines.slice();
    if (p >= 0.5) pool = pool.concat(sp.late, sp.late);   // 後半は、不穏な声が混ざりやすい
    // まだ持っていないカードの声を、少し出やすくする
    var withCard = pool.filter(function (l) { return l.card && state.cards.owned.indexOf(l.card) === -1; });
    var line = withCard.length && rand() < 0.3 ? withCard[Math.floor(rand() * withCard.length)] : pool[Math.floor(rand() * pool.length)];
    state.voice = { speaker: sp.id, name: sp.name, role: sp.role, text: line.text, card: line.card || null, left: q.lifetimeSeconds };
    state.nextVoiceIn = (q.minSeconds + rand() * (q.maxSeconds - q.minSeconds)) / rate;
    return state.voice;
  }

  /** 声を拾う。効果と、カードを手に入れたかを返す */
  function catchVoice(state, rand) {
    rand = rand || Math.random;
    if (!state.voice) return null;
    var v = state.voice;
    state.voice = null;
    state.stats.voicesCaught++;
    var total = QUOTE_EFFECTS.reduce(function (s, e) { return s + e.weight; }, 0);
    var r = rand() * total;
    var effect = QUOTE_EFFECTS[QUOTE_EFFECTS.length - 1];
    for (var i = 0; i < QUOTE_EFFECTS.length; i++) { r -= QUOTE_EFFECTS[i].weight; if (r <= 0) { effect = QUOTE_EFFECTS[i]; break; } }
    var detail = '';
    if (effect.id === 'fervor') state.buffs.push({ id: 'fervor', mult: 2, left: 20 });
    else if (effect.id === 'snack') {
      var gain = Math.max(computeRates(state).cps * 60, 10 * clickValue(state));
      state.cells += gain; state.totalCells += gain; detail = gain;
    } else state.heat = Math.max(0, state.heat - 15);
    var gotCard = null;
    if (v.card && state.cards.owned.indexOf(v.card) === -1) { state.cards.owned.push(v.card); gotCard = v.card; }
    return { voice: v, effect: effect, detail: detail, card: gotCard };
  }

  /** 彼の声を出す(拾えない。物語が進むほど頻繁になる) */
  function spawnHim(state, rand) {
    rand = rand || Math.random;
    var p = progress(state);
    var h = CONFIG.him;
    var levels = CT.HIM.filter(function (l) { return p >= l.from; });
    var rate = cardFx(state).himRate * cursedFx(state).himRate;
    var interval = (h.slowSeconds + (h.fastSeconds - h.slowSeconds) * p) / rate;
    state.nextHimIn = interval * (0.6 + 0.8 * rand());
    if (!levels.length) return null;
    // 新しい段階の言葉ほど出やすい
    var lv = levels[levels.length - 1];
    if (levels.length > 1 && rand() < 0.3) lv = levels[Math.floor(rand() * levels.length)];
    state.him = { text: lv.lines[Math.floor(rand() * lv.lines.length)], left: h.lifetimeSeconds };
    state.stats.himSeen++;
    return state.him;
  }

  /* ============================================================
   * カード
   * ========================================================== */
  function cardSlots(state) {
    return CONFIG.cardSlots + perkLevel(state, 'clinical') + bpMults(state).special.cardSlots + treeFx(state).cardSlots;
  }

  function equipCard(state, id) {
    if (state.cards.owned.indexOf(id) === -1) return false;
    var i = state.cards.equipped.indexOf(id);
    if (i !== -1) { state.cards.equipped.splice(i, 1); return true; }
    if (state.cards.equipped.length >= cardSlots(state)) return false;
    state.cards.equipped.push(id);
    return true;
  }

  function discardCard(state, id) {
    var c = CT.CARD_BY_ID[id];
    if (!c || c.sticky) return false;
    var i = state.cards.owned.indexOf(id);
    if (i === -1) return false;
    state.cards.owned.splice(i, 1);
    var j = state.cards.equipped.indexOf(id);
    if (j !== -1) state.cards.equipped.splice(j, 1);
    return true;
  }

  /* ============================================================
   * 条件の判定(行動で見つかるカード、写本の頁)
   * ========================================================== */
  function organTiers(state) {
    var r = bpEvaluate(state);
    var out = {};
    BP.ORGANS.forEach(function (o) { out[o.id] = r && r.organs[o.id] && r.organs[o.id].open ? r.organs[o.id].tier : -1; });
    return out;
  }

  function meets(state, c, ctx, tiers) {
    ctx = ctx || {};
    var st = state.stats;
    if (c.noCrashSeconds) return st.playSeconds - (state.run.lastCrashAt || 0) >= c.noCrashSeconds && st.playSeconds >= c.noCrashSeconds;
    if (c.sold) return st.sold >= c.sold;
    if (c.drugsUsed) return st.drugsUsed >= c.drugsUsed;
    if (c.crashes) return st.crashes >= c.crashes;
    if (c.clicks) return state.clicks >= c.clicks;
    if (c.dormantSeconds) return st.dormantSeconds >= c.dormantSeconds;
    if (c.sessionSeconds) return (ctx.sessionSeconds || 0) >= c.sessionSeconds;
    if (c.passages) return state.promotions >= c.passages;
    if (c.cursed) return st.cursedBought >= c.cursed;
    if (c.himSeen) return st.himSeen >= c.himSeen;
    if (c.cards) return state.cards.owned.length >= c.cards;
    if (c.pages) return state.story.pages.length >= c.pages;
    if (c.darkCard) return state.cards.owned.filter(function (id) { return CT.CARD_BY_ID[id] && CT.CARD_BY_ID[id].dark; }).length >= c.darkCard;
    if (c.awaySeconds) return st.maxAway >= c.awaySeconds;
    if (c.zone) return zoneOpen(state, c.zone);
    if (c.owned) return (state.counts[c.owned[0]] || 0) >= c.owned[1];
    if (c.seconded) return Object.keys(bpSeconded(state)).some(function (k) { return bpSeconded(state)[k] > 0; });
    if (c.finalPage) return state.story.pages.indexOf('final') !== -1;
    if (c.cleared) return !!state.story.cleared;
    tiers = tiers || organTiers(state);
    if (c.organTier !== undefined) return Object.keys(tiers).some(function (k) { return tiers[k] >= c.organTier; });
    if (c.organTierOf) return tiers[c.organTierOf[0]] >= c.organTierOf[1];
    if (c.allTier !== undefined) return BP.ORGANS.every(function (o) { return tiers[o.id] >= c.allTier; });
    return false;
  }

  /**
   * 見つかるものがないか調べる。画面は1秒ごとくらいに呼ぶ。
   * 返り値: 起きたことの一覧 [{ type: 'card'|'page'|'zone'|'ending', id }]
   */
  function checkProgress(state, ctx, rand) {
    rand = rand || Math.random;
    var events = [];
    var tiers = organTiers(state);
    var dark = progress(state) >= CONFIG.darkFrom;
    CT.CARDS.forEach(function (c) {
      if (!c.find || state.cards.owned.indexOf(c.id) !== -1) return;
      if (c.dark && !dark && !c.find.cleared && !c.find.finalPage) return;
      if (meets(state, c.find, ctx, tiers)) { state.cards.owned.push(c.id); events.push({ type: 'card', id: c.id }); }
    });
    CT.PAGES.forEach(function (p) {
      if (!p.cond || state.story.pages.indexOf(p.id) !== -1) return;
      if (!bpUnlocked(state) && p.kind !== 'lore') return;
      if (meets(state, p.cond, ctx, tiers)) {
        state.story.pages.push(p.id);
        events.push({ type: 'page', id: p.id });
        if (p.id === 'final') { state.bp.rev++; events.push({ type: 'seal' }); }
      }
    });
    // 散逸した頁: 設計図が開いてから、ときどき拾える
    if (bpUnlocked(state) && state.stats.playSeconds >= state.story.nextDropAt) {
      state.story.nextDropAt = state.stats.playSeconds + CONFIG.codex.dropEverySeconds;
      var left = CT.PAGES.filter(function (p) { return p.drop && state.story.pages.indexOf(p.id) === -1; });
      if (left.length && rand() < CONFIG.codex.dropChance * cardFx(state).codex) {
        var pg = left[Math.floor(rand() * left.length)];
        state.story.pages.push(pg.id);
        events.push({ type: 'page', id: pg.id, drop: true });
      }
    }
    // 樹の正体
    if (!state.tree.revealed && treeRevealed(state)) { state.tree.revealed = true; events.push({ type: 'qliphoth' }); }
    // 結末
    var r = bpEvaluate(state);
    if (r && r.altar && !state.story.cleared) {
      state.story.cleared = true;
      events.push({ type: 'ending' });
      CT.CARDS.forEach(function (c) {
        if (c.find && c.find.cleared && state.cards.owned.indexOf(c.id) === -1) { state.cards.owned.push(c.id); events.push({ type: 'card', id: c.id }); }
      });
    }
    return events;
  }

  /* ============================================================
   * 設計図
   * ========================================================== */
  function bpUnlocked(state) {
    return !!(state.seen && (state.seen.heart || state.seen.tailbud || state.seen.limb || state.seen.pharyngeal));
  }

  function zoneOpen(state, z) {
    var zone = BP.ZONE_BY_ID[z];
    if (!zone || !bpUnlocked(state)) return false;
    var u = zone.unlock;
    if (u.always) return true;
    if (u.lifetime) return (state.lifetimeCells || 0) + state.totalCells >= u.lifetime;
    if (u.final) return !!(state.story && state.story.pages.indexOf('final') !== -1);
    return false;
  }

  function bpTools(state) {
    var t = BP.toolsFor(openZoneCount(state), { theOne: zoneOpen(state, 'g') });
    var fx = treeFx(state);
    t.branch += fx.bpBranch;
    t.bridges += fx.bpBridges;
    return t;
  }

  function bpPieceAvailable(state, id) {
    var def = BP.PIECE_BY_ID[id];
    if (!def) return false;
    if (def.altarOnly) return zoneOpen(state, 'g');
    if (def.facility) return !!(state.seen && state.seen[def.facility]);
    var lim = bpTools(state).limits[id];
    return lim === undefined || lim > 0;
  }

  function bpContext(state) {
    return {
      zoneOpen: function (z) { return zoneOpen(state, z); },
      tools: bpTools(state),
      facilityOwned: function (fid) { return state.counts[fid] || 0; },
    };
  }

  var bpCache = { key: null, bp: null, value: null, seconded: null };
  function bpKey(state) {
    var zones = BP.ZONES.map(function (z) { return zoneOpen(state, z.id) ? 1 : 0; }).join('');
    var seen = state.seen || {};
    return state.bp.rev + '|' + zones + '|' + (state.counts.somite || 0) + ',' + (state.counts.notochord || 0) + ',' + (state.counts.lateral || 0) + '|' +
      (seen.somite ? 1 : 0) + (seen.notochord ? 1 : 0) + (seen.lateral ? 1 : 0);
  }
  function bpEvaluate(state) {
    if (!state.bp || !bpUnlocked(state)) return null;
    var key = bpKey(state);
    if (bpCache.key === key && bpCache.bp === state.bp) return bpCache.value;
    var r = BP.evaluate(state.bp, bpContext(state));
    bpCache = { key: key, bp: state.bp, value: r, seconded: null };
    return r;
  }

  function bpSeconded(state) {
    var r = bpEvaluate(state);
    if (!r) return {};
    if (bpCache.value === r && bpCache.seconded) return bpCache.seconded;
    var out = {};
    Object.keys(r.levels).forEach(function (k) {
      var p = state.bp.tiles[k];
      var def = p && BP.PIECE_BY_ID[p.id];
      if (def && def.facility) out[def.facility] = (out[def.facility] || 0) + r.levels[k] * BP.FACILITY_PER_LEVEL;
    });
    if (bpCache.value === r) bpCache.seconded = out;
    return out;
  }

  /** 上位の施設への倍率、設計図全体の倍率(指数)、器官の特別な役割 */
  function bpMults(state) {
    var out = { facility: {}, global: 1, exponent: 0, organs: {},
      special: { cardSlots: 0, cooling: 1, clearRA: 0, clearWnt: 0, residue: 1, drug: 1, tap: 1, offline: 0 } };
    var r = bpEvaluate(state);
    var c = function (id) {
      if (CONFIG.bpOverride && CONFIG.bpOverride[id] !== undefined) return CONFIG.bpOverride[id];
      var o = r && r.organs[id];
      if (!o || !o.open || o.empty) return null;
      return o.c;
    };
    Object.keys(BP_LINKS).forEach(function (fid) {
      var ms = BP_LINKS[fid].map(function (oid) { var v = c(oid); return v === null ? BP.UNCONNECTED : BP.tierMult(v); });
      out.facility[fid] = ms.reduce(function (a, b) { return a + b; }, 0) / ms.length;
    });
    var score = 0;
    var tier = {};
    BP.ORGANS.forEach(function (o) {
      var v = c(o.id);
      out.organs[o.id] = v;
      tier[o.id] = v === null ? 0 : BP.tierOf(v);
      score += o.weight * BP.TIER_SCORE[tier[o.id]];
    });
    out.exponent = score + cardFx(state).bpExp;
    out.global = Math.pow(2, out.exponent);
    var sp = out.special;
    sp.cardSlots = [0, 0, 1, 2][tier.thymus];
    sp.cooling = 1 + 0.25 * tier.thyroid;
    sp.clearRA = 0.03 * tier.liver;
    sp.clearWnt = 0.01 * (tier.kidneyL + tier.kidneyR);
    sp.residue = 1 + 0.5 * tier.gonad;
    sp.drug = 1 + 0.5 * tier.adrenal;
    sp.tap = 1 + tier.brain;
    sp.offline = 2 * tier.pineal;
    return out;
  }

  function bpCellUsable(state, x, y) {
    var z = BP.zoneAt(x, y);
    return !!z && zoneOpen(state, z);
  }

  /** 原基を置く(piece が null なら取り除く。つながっていた血管も消える) */
  function bpPlace(state, k, piece) {
    var xy = BP.parseKey(k);
    if (!bpCellUsable(state, xy[0], xy[1]) || BP.ORGAN_AT[k]) return { ok: false, msg: 'ここには置けない' };
    var altar = xy[0] === BP.ALTAR.x && xy[1] === BP.ALTAR.y;
    if (!piece) {
      if (!state.bp.tiles[k]) return { ok: false, msg: '何も置かれていない' };
      delete state.bp.tiles[k];
      state.bp.vessels = state.bp.vessels.filter(function (v) { return v.from !== k && v.to !== k; });
      state.bp.rev++;
      return { ok: true };
    }
    var def = BP.PIECE_BY_ID[piece.id];
    if (!def || !bpPieceAvailable(state, piece.id)) return { ok: false, msg: 'まだ使えない' };
    if (altar !== !!def.altarOnly) return { ok: false, msg: altar ? '祭壇には、ふさわしいものしか置けない' : 'これは祭壇にしか置けない' };
    // 血管が通っているマスには置けない
    var onVessel = state.bp.vessels.some(function (v) { return (v.cells || []).some(function (c) { return c[0] === xy[0] && c[1] === xy[1]; }); });
    if (onVessel) return { ok: false, msg: '血管が通っている' };
    var lim = def.facility ? Infinity : bpTools(state).limits[piece.id];
    var used = Object.keys(state.bp.tiles).filter(function (kk) { return kk !== k && state.bp.tiles[kk].id === piece.id; }).length;
    if (lim !== undefined && used >= lim) return { ok: false, msg: def.name + 'はこれ以上置けない(' + lim + 'つまで)' };
    state.bp.tiles[k] = def.facility ? { id: def.id, level: Math.max(1, Math.min(def.maxLevel, Math.floor(piece.level || 1))) } : { id: def.id };
    state.bp.rev++;
    return { ok: true };
  }

  /** 血管を引く(道は自動で探す) */
  function bpConnect(state, from, to) {
    var ctx = bpContext(state);
    var r0 = bpEvaluate(state);
    var srcTile = state.bp.tiles[from];
    var srcOrgan = BP.ORGAN_AT[from];
    if (!(srcTile && !BP.PIECE_BY_ID[srcTile.id].altarOnly) && !(srcOrgan && srcOrgan.product && zoneOpen(state, srcOrgan.zone))) return { ok: false, msg: 'そこからは流れが出ない' };
    var dstTile = state.bp.tiles[to];
    var dstOrgan = BP.ORGAN_AT[to];
    if (!(dstTile && !BP.PIECE_BY_ID[dstTile.id].altarOnly) && !(dstOrgan && zoneOpen(state, dstOrgan.zone))) return { ok: false, msg: 'そこは受け取れない' };
    if (from === to) return { ok: false, msg: '同じところへは引けない' };
    var outs = state.bp.vessels.filter(function (v) { return v.from === from; }).length;
    if (outs >= ctx.tools.branch) return { ok: false, msg: '1つの始点から引けるのは' + ctx.tools.branch + '本まで' };
    var cells = BP.route(state.bp, ctx, from, to);
    if (!cells) return { ok: false, msg: '通り道がない' };
    state.bp.vessels.push({ from: from, to: to, cells: cells, mods: {} });
    state.bp.rev++;
    // 輪になったら取り消す
    var r = bpEvaluate(state);
    if (r && r.errors['v' + (state.bp.vessels.length - 1)] || (r && r.cycle.length && (!r0 || r0.cycle.length < r.cycle.length))) {
      state.bp.vessels.pop();
      state.bp.rev++;
      return { ok: false, msg: '流れが輪になってしまう' };
    }
    return { ok: true, index: state.bp.vessels.length - 1 };
  }

  function bpDisconnect(state, index) {
    if (!state.bp.vessels[index]) return false;
    state.bp.vessels.splice(index, 1);
    state.bp.rev++;
    return true;
  }

  function bpSetMod(state, index, cellIndex, mod) {
    var v = state.bp.vessels[index];
    if (!v || cellIndex < 0 || cellIndex >= v.cells.length) return false;
    if (mod && !bpTools(state).mods[mod]) return false;
    v.mods = v.mods || {};
    if (mod) v.mods[cellIndex] = mod; else delete v.mods[cellIndex];
    state.bp.rev++;
    // 交差のマスには付けられない
    var r = bpEvaluate(state);
    if (mod && r && r.errors['v' + index]) { delete v.mods[cellIndex]; state.bp.rev++; return false; }
    return true;
  }

  function bpClearAll(state) {
    state.bp.tiles = {};
    state.bp.vessels = [];
    state.bp.rev++;
  }

  /* ============================================================
   * 樹
   * ========================================================== */
  function treeCost(id) { return TR.cost(id); }
  function buyNode(state, id) {
    var tr = state.tree;
    if (!TR.canBuy(tr.owned, id)) return false;
    var c = TR.cost(id);
    if (tr.shards < c) return false;
    tr.shards -= c;
    tr.owned[id] = true;
    state.bp.rev++;
    return true;
  }
  /** 正体が明かされたか(すべての球の核を持つか、結末を迎えたとき) */
  function treeRevealed(state) { return !!(state.tree.revealed || TR.revealed(state.tree.owned) || state.story.cleared); }

  /* ============================================================
   * 試験
   * ========================================================== */
  var TRIAL_UNLOCK = 5e4;
  function trialUnlocked(state) { return !!(state.trial.unlocked || state.totalCells >= TRIAL_UNLOCK); }

  /** 耐用試験に持ち込む力。invested は持ち込む細胞(最初の養分になる) */
  function trialStats(state, invested) {
    var fx = treeFx(state);
    var card = cardFx(state);
    var cps = computeRates(state).cps * CONFIG.speed;
    var r = bpEvaluate(state);
    var organs = {};
    BP.ORGANS.forEach(function (o) { var res = r && r.organs[o.id]; organs[o.id] = res && res.open && !res.empty ? res.tier : 0; });
    var inv = Math.max(0, invested || 0);
    var life = (state.lifetimeCells || 0) + state.totalCells;
    return {
      power: (1 + Math.log10(1 + cps)) * fx.trialDmg * Math.sqrt(card.tap > 1 ? Math.min(card.tap, 4) : 1),
      hp: 100 * (1 + 0.05 * Math.log10(1 + life)) * fx.trialHp,
      energy: 40 * fx.trialEnergy,
      energyRegen: 1.5 * fx.trialEnergy,
      rate: fx.trialRate,
      crit: fx.trialCrit,
      armor: fx.trialArmor,
      regen: fx.trialRegen,
      reveal: fx.trialReveal,
      move: fx.trialMove * fx.trialTap,
      foodMult: fx.trialFood,
      food0: Math.floor((30 + 10 * Math.log10(1 + inv)) * fx.trialFood),
      best: state.trial.best,
      organs: organs,
    };
  }

  /** 耐用試験を始める(持ち込む細胞を払う)。Trial の状態を返す */
  function startTrial(state, fraction, seed) {
    if (!trialUnlocked(state)) return null;
    state.trial.unlocked = true;
    var inv = state.cells * Math.max(0, Math.min(1, fraction || 0));
    state.cells -= inv;
    state.trial.runs++;
    return TL.create(trialStats(state, inv), seed || (Date.now() % 100000));
  }

  /** 耐用試験の結果を受け取る。拾った殻片を樹へ */
  function finishTrial(state, T) {
    var cleared = T.cleared;
    var record = cleared > state.trial.best;
    var shards = Math.floor(TL.shardsOf(T) * treeFx(state).shards);
    state.tree.shards += shards;
    if (record) state.trial.best = cleared;
    state.trial.history.unshift({ cleared: cleared, shards: shards, record: record, at: state.stats.playSeconds });
    state.trial.history = state.trial.history.slice(0, 10);
    return { shards: shards, record: record, cleared: cleared };
  }

  /** 次に開ける節のうち、一番安いものの値段(なければ 0) */
  function nextNodeCost(state) {
    var vis = TR.visibility(state.tree.owned), best = 0;
    Object.keys(vis).forEach(function (id) { if (vis[id] === 'open' && !state.tree.owned[id]) { var c = TR.cost(id); if (!best || c < best) best = c; } });
    return best;
  }

  /* ============================================================
   * 手技と継代
   * ========================================================== */
  function perkLevel(state, id) { return (state.perks && state.perks[id]) || 0; }
  function perkMult(state, id) {
    var lv = perkLevel(state, id);
    if (id === 'anatomy' || id === 'physiology') return Math.pow(1.1, lv);
    if (id === 'biochemistry') return Math.pow(2, lv);
    return 1;
  }
  function costMult(state) { return Math.pow(0.95, perkLevel(state, 'embryology')) * cursedFx(state).cost * treeFx(state).cost; }
  function perkCost(state, id) { return PERK_BY_ID[id].baseCost * (perkLevel(state, id) + 1); }
  function buyPerk(state, id) {
    var p = PERK_BY_ID[id];
    if (!p || perkLevel(state, id) >= p.max) return false;
    var cost = perkCost(state, id);
    if (state.units < cost) return false;
    state.units -= cost;
    state.perks[id] = perkLevel(state, id) + 1;
    return true;
  }

  /** 今継代したらもらえる残滓 */
  function promotionUnits(state) {
    if (state.totalCells < PROMOTION.minTotal) return 0;
    // 桁数の2乗に比例(育てるほど増えるが、ゆるやかに)
    var digits = Math.log10(state.totalCells / PROMOTION.unitScale) + 1;
    var base = PROMOTION.unitFactor * digits * digits;
    return Math.floor(base * cardFx(state).residue * bpMults(state).special.residue);
  }

  function titleOf(promotions, cleared) {
    if (cleared) return CT.FINAL_RANK;
    return promotions < CT.RANKS.length ? CT.RANKS[promotions] : CT.RANKS[CT.RANKS.length - 1];
  }

  /** 継代: 細胞と施設と強化を手放し、残滓・手技・カード・設計図・写本・振動子・記録は持ち越す */
  function promote(state, nowMs) {
    var u = promotionUnits(state);
    if (u < 1) return 0;
    var keep = {
      units: state.units + u, promotions: state.promotions + 1, perks: state.perks, cards: state.cards,
      lifetimeCells: state.lifetimeCells + state.totalCells, stats: state.stats, clicks: state.clicks, seen: state.seen,
      bp: state.bp, story: state.story, osc: state.osc, nextHimIn: state.nextHimIn, tree: state.tree, trial: state.trial, log: state.log,
    };
    var fresh = newState(nowMs);
    Object.keys(state).forEach(function (k) { delete state[k]; });
    Object.keys(fresh).forEach(function (k) { state[k] = fresh[k]; });
    Object.keys(keep).forEach(function (k) { state[k] = keep[k]; });
    state.run = { lastCrashAt: state.stats.playSeconds };
    state.story.nextDropAt = Math.max(state.story.nextDropAt, state.stats.playSeconds + 60);
    state.bp.rev++;
    state.cards.equipped = state.cards.equipped.slice(0, cardSlots(state));
    return u;
  }

  /* ============================================================
   * 購入・売却
   * ========================================================== */
  function facilityCost(f, owned, qty) {
    qty = qty || 1;
    var g = CONFIG.costGrowth;
    return f.baseCost * Math.pow(g, owned) * (Math.pow(g, qty) - 1) / (g - 1);
  }
  function maxAffordable(f, owned, cells) {
    var g = CONFIG.costGrowth;
    var first = f.baseCost * Math.pow(g, owned);
    if (cells < first) return 0;
    return Math.floor(Math.log(cells * (g - 1) / first + 1) / Math.log(g));
  }
  function facilityPrice(state, f, qty) { return facilityCost(f, state.counts[f.id], qty) * costMult(state); }
  function maxAffordableFor(state, f) { return maxAffordable(f, state.counts[f.id], state.cells / costMult(state)); }

  function buyFacility(state, id, qty) {
    var f = FACILITY_BY_ID[id];
    if (qty === 'max') qty = maxAffordableFor(state, f);
    if (!qty || qty < 1) return false;
    var cost = facilityPrice(state, f, qty);
    if (cost > state.cells + 1e-9) return false;
    state.cells -= cost;
    state.counts[id] += qty;
    if (!state.seen) state.seen = {};
    state.seen[id] = true;
    return true;
  }

  /** 売値: 最後に買った分の値段の半分(カードで上がる) */
  function sellValue(state, id, qty) {
    var f = FACILITY_BY_ID[id];
    var n = state.counts[id] || 0;
    qty = Math.min(qty || 1, n);
    if (qty < 1) return 0;
    return facilityCost(f, n - qty, qty) * costMult(state) * CONFIG.sellFraction * cardFx(state).sell;
  }
  function sellFacility(state, id, qty) {
    var n = state.counts[id] || 0;
    qty = qty === 'all' ? n : Math.min(qty || 1, n);
    if (qty < 1) return 0;
    var v = sellValue(state, id, qty);
    state.counts[id] -= qty;
    state.cells += v;
    state.stats.sold += qty;
    state.bp.rev++;
    return v;
  }

  function availableUpgrades(state) {
    var list = [];
    CLICK_UPGRADES.forEach(function (u, i) {
      if (state.upgrades[u.id]) return;
      if (i > 0 && !state.upgrades[CLICK_UPGRADES[i - 1].id]) return;
      list.push({ key: u.id, name: u.name, desc: u.desc, cost: u.cost, target: 'タップ', effect: 'タップ' + u.mult + '倍', unlocked: true });
    });
    FACILITIES.forEach(function (f) {
      UPGRADE_TIERS.forEach(function (t, i) {
        var key = f.id + ':' + i;
        if (state.upgrades[key]) return;
        if (i > 0 && !state.upgrades[f.id + ':' + (i - 1)]) return;
        if ((state.counts[f.id] || 0) < Math.ceil(t.need / 2)) return;
        var u = f.upgrades[i];
        var effect = i === 0 ? (f.upgradeKind === 'cooling' ? '冷まし方1.5倍' : f.upgradeKind === 'clearing' ? 'FGFの抑え方1.5倍' : f.name + 'の生産2倍')
          : (TIER2[f.id] ? TIER2[f.id].label : '');
        list.push({ key: key, name: u.name, desc: u.desc, cost: f.baseCost * t.costFactor * costMult(state), target: f.name, effect: effect,
          unlocked: state.counts[f.id] >= t.need, need: t.need });
      });
    });
    return list.sort(function (a, b) { return a.cost - b.cost; });
  }

  function buyUpgrade(state, key) {
    var u = availableUpgrades(state).filter(function (x) { return x.key === key; })[0];
    if (!u || !u.unlocked || state.cells < u.cost) return false;
    state.cells -= u.cost;
    state.upgrades[key] = true;
    return true;
  }

  /** 生産の何分ぶんか、という値段 */
  function minutesPrice(state, minutes, floor) {
    return Math.max(floor || 1000, computeRates(state).cps * CONFIG.speed * 60 * minutes);
  }

  // 振動子
  function oscillatorPrice(state, id) {
    var i = SIGNALS.map(function (s) { return s.id; }).indexOf(id);
    return Math.max(2e5 * Math.pow(5, i), minutesPrice(state, 15, 1));
  }
  function oscillatorsAvailable(state) { return state.totalCells >= CONFIG.cursedFrom || Object.keys(state.osc.owned).length > 0; }
  function buyOscillator(state, id) {
    if (!SIGNAL_BY_ID[id] || state.osc.owned[id] || !oscillatorsAvailable(state)) return false;
    var p = oscillatorPrice(state, id);
    if (state.cells < p) return false;
    state.cells -= p;
    state.osc.owned[id] = true;
    return true;
  }
  function setOscillator(state, id, cfg) {
    if (!state.osc.owned[id]) return false;
    if (!cfg) { delete state.osc.installed[id]; return true; }
    var installed = Object.keys(state.osc.installed);
    if (!state.osc.installed[id] && installed.length >= CONFIG.oscillatorSlots) return false;
    var level = Math.max(1, Math.min(3, Math.floor(cfg.level || 1)));
    var period = OSC_PERIODS.indexOf(cfg.period) !== -1 ? cfg.period : OSC_PERIODS[1];
    state.osc.installed[id] = { level: level, period: period };
    return true;
  }
  function sellOscillator(state, id) {
    if (!state.osc.owned[id]) return 0;
    var v = 2e5 * Math.pow(5, SIGNALS.map(function (s) { return s.id; }).indexOf(id)) * 0.3 * cardFx(state).sell;
    delete state.osc.owned[id];
    delete state.osc.installed[id];
    state.cells += v;
    state.stats.sold += 1;
    return v;
  }

  // 薬品庫
  function drugPrice(state, id) {
    var d = DRUG_BY_ID[id];
    return minutesPrice(state, d.price, 500) * cardFx(state).drugPrice;
  }
  function buyDrug(state, id) {
    var d = DRUG_BY_ID[id];
    if (!d) return false;
    var p = drugPrice(state, id);
    if (state.cells < p) return false;
    state.cells -= p;
    state.stats.drugsUsed++;
    var dur = (d.seconds || 0) * cardFx(state).drugDuration * bpMults(state).special.drug;
    if (d.heat) state.heat = Math.max(0, state.heat + d.heat);
    if (d.buff) state.buffs.push({ id: d.id, mult: d.buff, left: dur });
    if (d.emit || d.clear) {
      var cur = state.drugs.filter(function (x) { return x.id === id; })[0];
      if (cur) cur.left = Math.max(cur.left, dur); else state.drugs.push({ id: id, left: dur });
    }
    return true;
  }

  // 呪われた強化
  function cursedAvailable(state) {
    if (state.totalCells < CONFIG.cursedFrom) return [];
    var p = progress(state);
    return CURSED.filter(function (c) { return !c.minProgress || p >= c.minProgress; });
  }
  function cursedPrice(state, id) { return CURSED_BY_ID[id].price ? minutesPrice(state, CURSED_BY_ID[id].price, 1e5) : 0; }
  function buyCursed(state, id) {
    var c = CURSED_BY_ID[id];
    if (!c || state.cursed[id] || cursedAvailable(state).indexOf(c) === -1) return false;
    var p = cursedPrice(state, id);
    if (state.cells < p) return false;
    if (id === 'donation') { var g = minutesPrice(state, 60, 1e5); state.cells += g; state.totalCells += g; }
    state.cells -= p;
    state.cursed[id] = true;
    state.stats.cursedBought++;
    return true;
  }

  /* ============================================================
   * 臨界期
   * ========================================================== */
  function criticalWindow(state, nowMs) {
    var c = CONFIG.criticalWindow;
    var period = c.periodMinutes * 60000;
    var open = c.openMinutes * 60000;
    var index = Math.floor(nowMs / period);
    var into = nowMs - index * period;
    var remaining = WINDOW_UPGRADES.filter(function (w) { return !state.windowUpgrades[w.id]; });
    var isOpen = into < open && remaining.length > 0;
    var upgrade = remaining.length > 0 ? remaining[index % remaining.length] : null;
    var cost = upgrade ? Math.max(1000, computeRates(state).cps * 60 * c.costMinutesOfProduction) : 0;
    return { open: isOpen, upgrade: upgrade, cost: cost, closesInMs: isOpen ? open - into : 0, opensInMs: isOpen ? 0 : period - into };
  }
  function buyWindowUpgrade(state, nowMs) {
    var w = criticalWindow(state, nowMs);
    if (!w.open || !w.upgrade || state.cells < w.cost) return false;
    state.cells -= w.cost;
    state.windowUpgrades[w.upgrade.id] = true;
    return true;
  }

  /* ============================================================
   * 操作
   * ========================================================== */
  function click(state) {
    var v = clickValue(state);
    state.cells += v;
    state.totalCells += v;
    state.clicks++;
    return v;
  }
  function setDormant(state, on) { state.dormant = !!on; }
  function canApoptosis(state) {
    return state.apoptosisCooldown <= 0 && state.cells > 0 && state.crashLeft <= 0 && !cursedFx(state).noApoptosis;
  }
  function apoptosis(state) {
    if (!canApoptosis(state)) return false;
    var lv = perkLevel(state, 'pharmacology');
    state.cells *= (1 - Math.max(0.1, CONFIG.apoptosis.costFraction - 0.05 * lv));
    state.heat = Math.max(0, state.heat - CONFIG.apoptosis.heatDrop);
    state.signals.wnt *= 0.5;
    state.signals.fgf *= 0.5;
    state.apoptosisCooldown = CONFIG.apoptosis.cooldownSeconds * Math.max(0.4, 1 - 0.15 * lv) * cardFx(state).apoCooldown;
    return true;
  }

  /* ============================================================
   * 釣り合い(数値の調整と検証用。画面には出さない)
   * ========================================================== */
  function equilibriumSignals(state, env) {
    var out = { _wntFromSomite: 0 };
    SIGNALS.forEach(function (sig) {
      var fl = signalFlows(state, sig, undefined, env);
      out[sig.id] = fl.emit / fl.decay;
      if (sig.id === 'wnt') out._wntFromSomite = fl.fromSomite / fl.decay;
    });
    return out;
  }

  function equilibrium(state) {
    var s = clone(state);
    s.buffs = [];
    s.crashLeft = 0;
    s.refractoryLeft = 0;
    var env = buildEnv(s);
    var eqSignals = equilibriumSignals(s, env);
    var fromSomite = eqSignals._wntFromSomite;
    delete eqSignals._wntFromSomite;
    s.signals = eqSignals;
    var cooling = heatCooling(s, env);
    var perWnt = s.dormant ? 0 : SIGNAL_BY_ID.wnt.heat * heatGainMult(s, env);
    var heatMean = s.dormant ? 0 : heatGain(s, s.signals, env) / cooling;
    var w = 2 * Math.PI / CONFIG.segmentationClock.periodSeconds;
    var wntDecay = SIGNAL_BY_ID.wnt.decay;
    var damp = 1 / Math.sqrt(1 + Math.pow(w / wntDecay, 2)) / Math.sqrt(1 + Math.pow(w / cooling, 2));
    var swing = perWnt * fromSomite / cooling * CONFIG.segmentationClock.amplitude * env.mods.somite.amp * damp;
    var heatPeak = heatMean + swing;
    var limit = CONFIG.heat.stages[2];
    s.heat = 0;
    var flat = computeRates(s, env).cps * CONFIG.speed;
    var k = CONFIG.heat.bonusAtMax / 100;
    var normal = flat * (1 + k * Math.min(heatMean, limit));
    if (heatPeak < limit) return { heat: heatMean, heatPeak: heatPeak, cps: normal, cpsNormal: normal, crashes: false, crashInSeconds: null, signals: s.signals };
    var h = CONFIG.heat;
    var target = Math.max(heatMean + swing, limit + 1);
    var Tc = h.crashSeconds, Tr = env.curse.refractorySeconds * env.card.refractory;
    var heatAfterRefractory = h.afterCrashHeat * Math.exp(-cooling * Tr);
    var areaRefractory = h.afterCrashHeat * (1 - Math.exp(-cooling * Tr)) / cooling;
    var rise = Math.log((target - heatAfterRefractory) / (target - limit)) / cooling;
    var areaRise = target * rise - (limit - heatAfterRefractory) / cooling;
    var produced = flat * (env.curse.crashMult * (1 + k * limit) * Tc + h.refractoryMultiplier * (Tr + k * areaRefractory) + (rise + k * areaRise));
    var avg = produced / (Tc + Tr + rise);
    var from = Math.min(state.heat, limit - 1e-6);
    var crashIn = state.crashLeft > 0 ? 0 : Math.max(0, Math.log((target - from) / (target - limit)) / cooling) + (state.refractoryLeft || 0);
    return { heat: heatMean, heatPeak: heatPeak, cps: avg, cpsNormal: normal, crashes: true, crashInSeconds: crashIn, signals: s.signals };
  }

  function simulate(state, seconds, stepSeconds) {
    var s = clone(state);
    var maxHeat = s.heat, crashed = false;
    for (var t = 0; t < seconds - 1e-9; t += stepSeconds) {
      var before = s.stats.crashes;
      step(s, stepSeconds);
      if (s.stats.crashes > before) crashed = true;
      if (s.heat > maxHeat) maxHeat = s.heat;
    }
    return { state: s, cps: computeRates(s).cps, maxHeat: maxHeat, crashed: crashed, cells: s.cells };
  }

  /** 1つ買った場合の落ち着き先の比較(模擬プレイの「熟練した買い方」用) */
  function previewAll(state) {
    var now = equilibrium(state);
    var results = {}, best = null;
    FACILITIES.forEach(function (f) {
      var s = clone(state);
      s.counts[f.id] += 1;
      var after = equilibrium(s);
      var cost = facilityPrice(state, f, 1);
      var gain = after.cps - now.cps;
      results[f.id] = { cps: after.cps, gain: gain, heat: after.heat, heatPeak: after.heatPeak, crashes: after.crashes, newlyCrashes: after.crashes && !now.crashes, cost: cost };
      if (cost <= state.cells && gain > 0) { var sc = gain / cost; if (!best || sc > best.score) best = { id: f.id, score: sc }; }
    });
    if (!now.crashes && !state.dormant && state.counts.somite > 0) {
      var withReg = clone(state);
      withReg.counts.regulator += 1;
      var bundleCost = results.regulator.cost, extra = 0, bestCombo = null;
      while (extra < 12) {
        bundleCost += facilityPrice(withReg, FACILITY_BY_ID.somite, 1);
        withReg.counts.somite += 1;
        extra++;
        var e = equilibrium(withReg);
        if (e.crashes) break;
        var g = e.cps - now.cps;
        if (g > 0 && (!bestCombo || g / bundleCost > bestCombo.score)) bestCombo = { somites: extra, cost: bundleCost, gain: g, score: g / bundleCost };
      }
      if (bestCombo) {
        results.regulator.headroom = bestCombo;
        if (results.regulator.cost <= state.cells && (!best || bestCombo.score > best.score)) best = { id: 'regulator', score: bestCombo.score };
      }
    }
    if (now.crashes && !state.dormant) {
      var t = clone(state), m = 0, total = 0, eqAfter = now;
      while (m < 30) {
        total += facilityPrice(t, FACILITY_BY_ID.regulator, 1);
        t.counts.regulator += 1;
        m++;
        eqAfter = equilibrium(t);
        if (!eqAfter.crashes) break;
      }
      if (!eqAfter.crashes) {
        var bundleGain = eqAfter.cps - now.cps;
        results.regulator.stopCrash = { count: m, cost: total, gain: bundleGain };
        if (results.regulator.cost <= state.cells && bundleGain > 0 && (!best || bundleGain / total > best.score)) best = { id: 'regulator', score: bundleGain / total };
      }
    }
    return { now: now, facilities: results, best: best ? best.id : null };
  }

  /* ============================================================
   * 閉じていた間
   * ========================================================== */
  function offlineCapSeconds(state) {
    return (CONFIG.offlineCapHours + cardFx(state).offline + bpMults(state).special.offline) * 3600;
  }

  function catchUp(state, nowMs) {
    var elapsed = Math.max(0, (nowMs - state.lastSavedMs) / 1000);
    var capped = Math.min(elapsed, offlineCapSeconds(state));
    var before = state.cells;
    var crashesBefore = state.stats.crashes;
    var t = 0;
    while (t < capped - 1e-9) {
      var dt = Math.min(CONFIG.offlineStepSeconds, capped - t);
      step(state, dt);
      t += dt;
    }
    if (elapsed > state.stats.maxAway) state.stats.maxAway = elapsed;
    // 閉じている間に溜まった声は、開いたときには消えている
    state.voice = null;
    state.him = null;
    state.lastSavedMs = nowMs;
    return { seconds: elapsed, simulated: capped, gained: state.cells - before, crashes: state.stats.crashes - crashesBefore };
  }

  /* ============================================================
   * セーブ
   * ========================================================== */
  function serialize(state, nowMs) {
    state.lastSavedMs = nowMs;
    return JSON.stringify(state);
  }

  function deserialize(text, nowMs) {
    var fresh = newState(nowMs);
    var data;
    try { data = JSON.parse(text); } catch (e) { return fresh; }
    if (!data || data.version !== 2) return fresh;
    Object.keys(fresh).forEach(function (k) {
      if (data[k] === undefined) return;
      if (k === 'counts' || k === 'signals' || k === 'stats' || k === 'bp' || k === 'story' || k === 'osc' || k === 'run' || k === 'tree' || k === 'trial') fresh[k] = Object.assign(fresh[k], data[k]);
      else fresh[k] = data[k];
    });
    return fresh;
  }

  /* ============================================================
   * 表示用
   * ========================================================== */
  var UNITS = [[1e44, '載'], [1e40, '正'], [1e36, '澗'], [1e32, '溝'], [1e28, '穣'], [1e24, '𥝱'], [1e20, '垓'], [1e16, '京'], [1e12, '兆'], [1e8, '億'], [1e4, '万']];
  function formatNumber(n) {
    if (!isFinite(n)) return '∞';
    if (n < 0) return '-' + formatNumber(-n);
    for (var i = 0; i < UNITS.length; i++) {
      if (n >= UNITS[i][0]) {
        var v = n / UNITS[i][0];
        var digits = v >= 1000 ? 0 : v >= 100 ? 1 : 2;
        var shown = Number(v.toFixed(digits));
        // 丸めて1万になったら、ひとつ上の単位で出す(10000億 → 1兆)

<script>
/*

 */
(function () {
  'use strict';

  var CT = C.CT;

  })();
  var sessionStart = performance.now();

  // ?speed=10 で生産を速める(試す用)
  var params = new URLSearchParams(location.search);
  var speedParam = Number(params.get('speed'));
  if (speedParam > 0 && speedParam <= 1000) C.CONFIG.speed = speedParam;

  /* ---------- 保存 ---------- */
  function storageGet() { try { return localStorage.getItem(SAVE_KEY); } catch (e) { return null; } }
  function storageSet(v) { try { localStorage.setItem(SAVE_KEY, v); } catch (e) { /* 保存できない環境では何もしない */ } }
  function storageDel() { try { localStorage.removeItem(SAVE_KEY); } catch (e) { /* 同上 */ } }
  var saveDisabled = false;
  function save() { if (!saveDisabled) storageSet(C.serialize(state, Date.now())); }

  /* ---------- 小道具 ---------- */
  var fmt = C.formatNumber;
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function pct(x) { var v = x * 100, a = Math.abs(v); return (v >= 0 ? '+' : '-') + (a < 10 ? a.toFixed(1) : String(Math.round(a))) + '%'; }
  function mmss(ms) { var s = Math.max(0, Math.ceil(ms / 1000)); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }

  var TOAST_ICON = {
    '': '<svg viewBox="0 0 22 22"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="2.5" fill="currentColor"/></svg>',
    red: '<svg viewBox="0 0 22 22"><path d="M11 2 L20 19 L2 19 Z" fill="none" stroke="currentColor" stroke-width="1.5"/><line x1="11" y1="8" x2="11" y2="13" stroke="currentColor" stroke-width="1.8"/><circle cx="11" cy="16" r="1.2" fill="currentColor"/></svg>',
    blue: '<svg viewBox="0 0 22 22"><path d="M3 6 H19 V15 H10 L5 19 V15 H3 Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    gold: '<svg viewBox="0 0 22 22"><path d="M11 2 L13.5 8.5 L20 9 L15 13.5 L16.5 20 L11 16.5 L5.5 20 L7 13.5 L2 9 L8.5 8.5 Z" fill="none" stroke="currentColor" stroke-width="1.5"/></svg>',
    dark: '<svg viewBox="0 0 22 22"><ellipse cx="11" cy="11" rx="9" ry="5" fill="none" stroke="currentColor" stroke-width="1.5"/><circle cx="11" cy="11" r="3" fill="currentColor"/></svg>',
  };

  }

  /* ---------- 状態の読み込み ---------- */
  var state;
  (function load() {
    var saved = storageGet();

    else state = C.newState(now);
  })();

  /* ---------- 施設のアイコン(仮の図形、線画) ---------- */

    notochord: '<rect x="16" y="2" width="8" height="36" ' + IC + '/>',
    epidermis: '<rect x="4" y="4" width="15" height="15" ' + IC + '/><rect x="21" y="4" width="15" height="15" ' + IC + '/><rect x="4" y="21" width="15" height="15" ' + IC + '/><rect x="21" y="21" width="15" height="15" fill="none" stroke="#a3808f" stroke-width="2"/>',

    lateral: '<rect x="3" y="8" width="8" height="24" ' + IC + '/><rect x="29" y="8" width="8" height="24" ' + IC + '/><line x1="20" y1="8" x2="20" y2="32" stroke="#9b90a8" stroke-width="2"/>',

    sprouty: '<line x1="6" y1="20" x2="34" y2="20" stroke="#8f88a3" stroke-width="2"/><line x1="20" y1="6" x2="20" y2="34" stroke="#8fa996" stroke-width="2"/><circle cx="20" cy="20" r="5" ' + IC + '/>',

    pharyngeal: '<line x1="6" y1="7" x2="34" y2="7" ' + IC + '/><line x1="6" y1="16" x2="30" y2="16" ' + IC + '/><line x1="6" y1="25" x2="26" y2="25" ' + IC + '/><line x1="6" y1="34" x2="22" y2="34" stroke="#9b90a8" stroke-width="2"/>',
  };

  /* ---------- 声 ---------- */
  $('voice').addEventListener('click', function () {
    var res = C.catchVoice(state);
    if (!res) return;
    var msg = res.effect.label;
    if (res.effect.id === 'snack') msg = '差し入れ: +' + fmt(res.detail) + ' 細胞';
    toast(res.voice.name + '「' + res.voice.text + '」', 'blue');
    if (res.card) { toast(CT.CARD_BY_ID[res.card].name, 'gold'); newCard = true; pushLog('event', 'カード', CT.CARD_BY_ID[res.card].name); }
  });

  /* ---------- 休眠・アポトーシス ---------- */
  $('btnDormant').addEventListener('click', function () {
    C.setDormant(state, !state.dormant);
  });
  $('btnApoptosis').addEventListener('click', function () {
    if (C.apoptosis(state)) toast('アポトーシス', 'red');
  });

  /* ---------- 臨界期 ---------- */
  $('btnWindow').addEventListener('click', function () {
    var w = C.criticalWindow(state, Date.now());

    if (C.buyWindowUpgrade(state, Date.now())) toast(name, '');
  });

  var htmlCache = {};
  function setPanel(id, html) {
    if (htmlCache[id] === html) return;
    htmlCache[id] = html;
    $(id).innerHTML = html;
  }
  function setText(el, t) { if (el.textContent !== t) el.textContent = t; }
  function setHTML(el, h) { if (el.__h !== h) { el.innerHTML = h; el.__h = h; } }

  /* ---------- 培養(施設) ---------- */
  var qty = '1';
  var facMode = 'buy';
  function bindSeg(id, attr, fn) {

      b.addEventListener('click', function () {

        fn(b.dataset[attr]);

  bindSeg('qty', 'q', function (v) { qty = v; });
  bindSeg('facMode', 'm', function (v) { facMode = v; $('win-fac').classList.toggle('selling', v === 'sell'); });

  function renderUpgrades() {

  /* ---------- 写本(手引き・関係・頁) ---------- */
  var newPage = false;
  function relationTags(f) {
    var t = [];
    var name = function (id) { return C.SIGNAL_BY_ID[id].name; };
    Object.keys(f.emits || {}).forEach(function (s) { t.push(['emit', name(s) + 'を出す']); });
    Object.keys(f.clears || {}).forEach(function (s) { t.push(['cl', name(s) + 'を分解する']); });
    (f.responses || []).forEach(function (r) {
      if (r.type === 'activate') t.push(['up', name(r.signal) + 'で強まる']);
      else if (r.type === 'inhibit') t.push(['dn', name(r.signal) + 'で弱まる']);
      else t.push(['win', name(r.signal) + 'は程々に']);
    });
    if (f.selfInhibit) t.push(['dn', '群れると鈍る']);
    if (f.upgradeKind === 'cooling') t.push(['cl', 'ヒートを冷ます']);
    if (f.globalPenalty) t.push(['dn', '全体を鈍らせる']);
    if (f.id === 'somite') t.push(['emit', 'Wntが波打つ']);
    if (C.bpUnlocked(state) && BP.PIECES.some(function (p) { return p.facility === f.id; })) t.push(['cl', '原基']);
    return t;
  }
  var GUIDE = [
    ['fac', function () { return C.FACILITIES.some(function (f) { return state.counts[f.id] > 0; }); }, '施設は、手を離しても増やし続ける。'],
    ['heat', function () { return state.heat >= 30; }, 'WntとFGFが濃くなると、胚は熱を帯びる。'],
    ['crash', function () { return state.stats.crashes > 0; }, '熱が満ちると暴走する。明けた後も、しばらく鈍い。'],
    ['dorm', function () { return state.stats.dormantSeconds > 0; }, '眠っているあいだは熱を持たない。そのぶん遅い。'],
    ['window', function () { return C.criticalWindow(state, Date.now()).open || Object.keys(state.windowUpgrades).length > 0; }, '臨界期は、時計に従って開き、閉じる。'],
    ['osc', function () { return Object.keys(state.osc.owned).length > 0; }, '振動子は、シグナルに波をつくる。'],
    ['card', function () { return state.cards.owned.length > 0; }, 'カードは、身につけているあいだだけ効く。'],
    ['drug', function () { return state.stats.drugsUsed > 0; }, '薬は効く。効きすぎることもある。'],
    ['promote', function () { return state.promotions > 0 || C.promotionUnits(state) > 0; }, '継代すれば、胚は始まりに戻る。残滓だけが残る。'],

  /* ---------- 波形 ---------- */
  var wave = [];

  function recordWave() {
    wave.push({ wnt: state.signals.wnt, bmp: state.signals.bmp, shh: state.signals.shh, fgf: state.signals.fgf, ra: state.signals.ra, heat: state.heat });
    if (wave.length > 300) wave.shift();
  }
  function renderWave() {
    var W = 360, H = 160;
    if (wave.length < 2) { setPanel('wave', ''); setPanel('waveLegend', ''); return; }
    var series = C.SIGNALS.map(function (s) { return { id: s.id, name: s.name, color: SIG_COLOR[s.id] }; }).concat([{ id: 'heat', name: 'ヒート', color: '#ffffff' }]);
    var out = '<svg viewBox="0 0 ' + W + ' ' + H + '">';
    for (var g = 1; g < 4; g++) out += '<line x1="0" y1="' + (H * g / 4) + '" x2="' + W + '" y2="' + (H * g / 4) + '" stroke="rgba(170,185,180,.12)"/>';
    var legend = '';
    series.forEach(function (s) {
      var vals = wave.map(function (w) { return w[s.id]; });
      var mx = s.id === 'heat' ? 100 : Math.max(0.5, Math.max.apply(null, vals));
      if (s.id !== 'heat' && Math.max.apply(null, vals) < 0.01) return;
      var pts = vals.map(function (v, i) { return (i / 299 * W).toFixed(1) + ',' + (H - 4 - v / mx * (H - 8)).toFixed(1); }).join(' ');
      out += '<polyline points="' + pts + '" fill="none" stroke="' + s.color + '" stroke-width="' + (s.id === 'heat' ? 1 : 1.5) + '"' + (s.id === 'heat' ? ' stroke-dasharray="3 3"' : '') + ' opacity=".9"/>';
      legend += '<span><i style="background:' + s.color + '"></i>' + esc(s.name) + ' ' + vals[vals.length - 1].toFixed(s.id === 'heat' ? 0 : 2) + (s.id === 'heat' ? '' : '(最大' + mx.toFixed(1) + ')') + '</span>';
    });
    out += '</svg>';
    setPanel('wave', out);
    setPanel('waveLegend', legend);
  }

  /* ============================================================
   * 小窓(PC)とタブ(スマホ)。ui.js の中に差し込まれる

  var WINDOWS = [
    { id: 'fac', title: '培養' }, { id: 'upg', title: '強化' }, { id: 'drug', title: '薬品庫' }, { id: 'bp', title: '設計図' },
    { id: 'trial', title: '耐用試験' }, { id: 'tree', title: '樹' }, { id: 'codex', title: '写本' }, { id: 'log', title: '通信' },
    { id: 'rec', title: '記録' }, { id: 'grade', title: '継代' },
  ];
  var LAYOUT_KEY = 'embryo-genesis-layout-2';
  var deskMQ = window.matchMedia('(min-width: 900px)');
  function isDesk() { return deskMQ.matches; }
  var activeTab = 'fac';
  var layout = null;
  var zTop = 10;

  function defaultLayout() {
    var W = window.innerWidth, H = window.innerHeight - 52;
    var L = {
      core: { x: 12, y: 12, w: 320, h: 340, open: true },
      fac: { x: 12, y: 364, w: 360, h: Math.max(240, H - 376), open: true },
      log: { x: Math.max(400, W - 392), y: Math.max(12, H - 272), w: 380, h: 260, open: true },
      bp: { x: Math.max(400, W - 652), y: 12, w: 640, h: Math.max(300, H - 300), open: false },
    };
    var cx = Math.round(W / 2), cy = Math.round(H / 2);
    ['upg', 'drug', 'codex', 'rec', 'grade'].forEach(function (id, i) { L[id] = { x: cx - 220 + i * 26, y: 40 + i * 26, w: 440, h: Math.min(620, H - 80), open: false }; });
    L.trial = { x: Math.max(12, cx - 520), y: 8, w: Math.min(W - 24, 1040), h: H - 16, open: false };
    L.tree = { x: Math.max(12, cx - 360), y: 24, w: 720, h: H - 48, open: false };
    return L;
  }
  function loadLayout() {
    var d = defaultLayout();
    try {
      var saved = JSON.parse(localStorage.getItem(LAYOUT_KEY) || 'null');
      if (saved) Object.keys(d).forEach(function (k) { if (saved[k]) d[k] = Object.assign(d[k], saved[k]); });
    } catch (e) { /* 読めなければ初期の配置 */ }
    return d;
  }
  function saveLayout() { try { localStorage.setItem(LAYOUT_KEY, JSON.stringify(layout)); } catch (e) { /* 何もしない */ } }

  function winEl(id) { return $('win-' + id); }
  function applyLayout() {
    if (!isDesk()) {
      ['core'].concat(WINDOWS.map(function (w) { return w.id; })).forEach(function (id) { var el = winEl(id); el.style.cssText = ''; el.classList.remove('closed'); });
      return;
    }
    var W = window.innerWidth, H = window.innerHeight - 52;
    Object.keys(layout).forEach(function (id) {
      var el = winEl(id), L = layout[id];
      if (!el) return;
      L.x = Math.max(0, Math.min(L.x, W - 120));

      for (var ri = o.ripples.length - 1; ri >= 0; ri--) if (o.ripples[ri].t >= 0.7) o.ripples.splice(ri, 1);
      o.ripples.forEach(function (rp) {
        g.strokeStyle = 'rgba(159,189,184,' + (0.35 * (1 - rp.t / 0.7)) + ')';
        g.lineWidth = 1;
        g.beginPath(); g.arc(rp.x, rp.y, 4 + rp.t * M * 0.35, 0, Math.PI * 2); g.stroke();
      });
    }
    g.globalCompositeOperation = 'source-over';
    // 走査線
    var sweepY = (now / 22) % (H * 1.4) - H * 0.2;
    var sw = g.createLinearGradient(0, sweepY - 24, 0, sweepY + 24);
    sw.addColorStop(0, 'rgba(159,189,184,0)'); sw.addColorStop(0.5, 'rgba(159,189,184,.035)'); sw.addColorStop(1, 'rgba(159,189,184,0)');
    g.fillStyle = sw; g.fillRect(0, sweepY - 24, W, 48);
    g.fillStyle = 'rgba(0,0,0,.22)';
    for (var y = 0; y < H; y += 2) g.fillRect(0, y, W, 1);
    // ざらつき
    var nN = Math.round(W * H / 260);
    for (var n = 0; n < nN; n++) {
      var v = Math.random();
      g.fillStyle = v < 0.5 ? 'rgba(0,0,0,.35)' : 'rgba(200,200,190,' + (0.03 + 0.05 * Math.random()) + ')';
      g.fillRect(Math.random() * W, Math.random() * H, 1, 1);
    }
    // 減色(4x4のディザで、決まった段にしか色を置かない)
    try {
      var im = g.getImageData(0, 0, W, H), dd = im.data;
      var B = [0, 8, 2, 10, 12, 4, 14, 6, 3, 11, 1, 9, 15, 7, 13, 5];
      var LV = [0, 0.16, 0.34, 0.58, 0.82, 1.05];
      var red = [169, 82, 76];
      for (var py = 0; py < H; py++) for (var pxx = 0; pxx < W; pxx++) {
        var ix = (py * W + pxx) * 4, r0 = dd[ix], g0 = dd[ix + 1], b0 = dd[ix + 2];
        var L = Math.max(r0, g0, b0) / 255;
        var th = (B[(py & 3) * 4 + (pxx & 3)] + 0.5) / 16 - 0.5;
        var lv = Math.max(0, Math.min(LV.length - 1, Math.round(L * (LV.length - 1) + th)));
        var base = (r0 - g0 > 40) ? red : col;
        var k2 = LV[lv];
        dd[ix] = Math.min(255, base[0] * k2 * 1.1 + 6); dd[ix + 1] = Math.min(255, base[1] * k2 * 1.1 + 7); dd[ix + 2] = Math.min(255, base[2] * k2 * 1.1 + 7);
      }
      g.putImageData(im, 0, 0);
    } catch (e) { /* 何もしない */ }
    // 乱れ
    if (o.glitch > 0) {
      for (var k = 0; k < 3; k++) {
        var gy = Math.random() * H, gh = 2 + Math.random() * 10, off = (Math.random() - 0.5) * 14;

  function renderBpSvg(r) {

        if (ch === 'x' && !open) out += '<rect x="' + (x * S + 1) + '" y="' + (y * S + 1) + '" width="' + (S - 2) + '" height="' + (S - 2) + '" fill="rgba(163,128,143,.12)" stroke="#a3808f" stroke-width="1" stroke-dasharray="2 2"/>';
        else if (ch === 'g' && !open) out += '<rect x="' + (x * S) + '" y="' + (y * S) + '" width="' + S + '" height="' + S + '" fill="#000"/>';
        else out += '<rect x="' + (x * S + 0.5) + '" y="' + (y * S + 0.5) + '" width="' + (S - 1) + '" height="' + (S - 1) + '" fill="' + tint + '" fill-opacity="' + (open ? 0.07 : 0.02) + '" stroke="' + tint + '" stroke-opacity="' + (open ? 0.28 : 0.08) + '"/>';
      }

      var ok = r.vesselOk[i];

      var col = !ok ? '#a9524c' : blood ? '#9c514b' : '#9fbdb8';
      out += '<polyline points="' + pts + '" fill="none" stroke="' + col + '" stroke-width="' + Math.max(2, S * 0.16) + '" stroke-linejoin="round" opacity=".85"' + (ok ? '' : ' stroke-dasharray="4 3"') + '/>';
      Object.keys(v.mods || {}).forEach(function (j) {
        var c = v.cells[j];
        if (!c) return;
        out += '<rect x="' + (c[0] * S + S * 0.18) + '" y="' + (c[1] * S + S * 0.18) + '" width="' + (S * 0.64) + '" height="' + (S * 0.64) + '" fill="#1a1718" stroke="#a3808f"/>' +
          '<text x="' + (c[0] * S + S / 2) + '" y="' + (c[1] * S + S * 0.66) + '" font-size="' + (S * 0.42) + '" text-anchor="middle" fill="#a3808f">' + MOD_MARK[v.mods[j]] + '</text>';
      });
    });
    // 器官
    BP.ORGANS.forEach(function (o) {
      var res = r.organs[o.id];

      var open = res.open;
      var c = res.empty ? 0 : res.c;
      var col = !open ? '#3c3f3e' : res.tier === 3 ? '#a3808f' : res.tier === 2 ? '#b8a27a' : res.tier === 1 ? '#8fa996' : '#9fbdb8';
      out += '<circle cx="' + cx + '" cy="' + cy + '" r="' + rr + '" fill="#121313" stroke="' + col + '" stroke-width="1.5"' + (open && !res.empty ? '' : ' stroke-dasharray="3 2"') + '/>';
      if (open && !res.empty) {
        var ang = c * 2 * Math.PI;
        var x2 = cx + rr * Math.sin(ang), y2 = cy - rr * Math.cos(ang);

      out += '<rect x="' + (p[0] * S + 2) + '" y="' + (p[1] * S + 2) + '" width="' + (S - 4) + '" height="' + (S - 4) + '" fill="#141515" stroke="' + col + '" stroke-width="1.5"/>';
      var lv = def.facility ? (r.levels[k] !== undefined ? r.levels[k] : t.level) : '';
      out += '<text x="' + (p[0] * S + S / 2) + '" y="' + (p[1] * S + S * 0.62) + '" font-size="' + (S * 0.34) + '" text-anchor="middle" fill="' + col + '">' + esc(def.short.slice(0, 2)) + (lv !== '' ? lv : '') + '</text>';
    });

    if (bpSrc) { var sp = BP.parseKey(bpSrc); out += '<rect x="' + (sp[0] * S) + '" y="' + (sp[1] * S) + '" width="' + S + '" height="' + S + '" fill="none" stroke="#a3808f" stroke-width="3"><animate attributeName="stroke-opacity" values="1;.3;1" dur="1s" repeatCount="indefinite"/></rect>'; }

  function bpTap(k) {
    var xy = BP.parseKey(k);
    if (bpMode === 'vessel') {
      if (!bpSrc) {
        if (canSource(k)) { bpSrc = k; bpSel = null; }
        else { bpSel = k; }
        return;
      }
      if (k === bpSrc) { bpSrc = null; return; }
      var res = C.bpConnect(state, bpSrc, k);
      if (!res.ok) toast(res.msg, 'red');
      return;
    }
    if (bpMode === 'erase') {
      if (state.bp.tiles[k]) { C.bpPlace(state, k, null); return; }
      var vs = vesselsAt(xy[0], xy[1]);
      if (vs.length) { C.bpDisconnect(state, vs[vs.length - 1].i); toast('血管を消した', ''); return; }
      bpSel = k;
      return;
    }
    bpSel = k;
  }

  function onBpClick(ev) {
    var t = ev.target.closest('[data-k],button');
    if (!t) return;
    var d = t.dataset;
    if (d.k) bpTap(d.k);
    else if (d.mode) { bpMode = d.mode; bpSrc = null; }
    else if (d.zoom) bpZoom = !bpZoom;
    else if (d.clearall) {
      if (Date.now() - bpClearArmed < 3000) { C.bpClearAll(state); bpSel = null; bpSrc = null; bpClearArmed = 0; }
      else { bpClearArmed = Date.now(); toast('もう一度', 'red'); }
    } else if (d.piece !== undefined && bpSel) {
      var def = BP.PIECE_BY_ID[d.piece];
      var res = C.bpPlace(state, bpSel, def.facility ? { id: def.id, level: 1 } : { id: def.id });
      if (!res.ok) toast(res.msg, 'red');
    } else if (d.level && bpSel) {
      var cur = state.bp.tiles[bpSel];
      if (cur) C.bpPlace(state, bpSel, { id: cur.id, level: Number(d.level) });
    } else if (d.remove && bpSel) {
      C.bpPlace(state, bpSel, null);
    } else if (d.unlink !== undefined) {
      C.bpDisconnect(state, Number(d.unlink));
    } else if (d.mod !== undefined) {
      var p = d.mod.split(':');
      if (!C.bpSetMod(state, Number(p[0]), Number(p[1]), p[2] || null)) toast('ここには付けられない', 'red');
    } else return;
    htmlCache = {};
    render(true);
  }

      else if (e.type === 'kill') trial.fx.push({ kind: 'burst', x: e.x, y: e.y, t: 0, life: 0.45, boss: e.boss });
      else if (e.type === 'pick') trial.fx.push({ kind: 'pick', x: e.x, y: e.y, t: 0, life: 0.35 });

  /* ---------- 描画 ---------- */
  function fxy(cv, x, y) { return [(x + 1) / 2 * cv.width, (y + 1) / 2 * cv.height]; }
  function eqRange(q) {

    if (q.id === 'turret') return d.range * (1 + 0.03 * (lv - 1));
    if (q.id === 'laser' || q.id === 'mortar' || q.id === 'tesla') return d.range;
    if (q.id === 'freezer') return d.radius + 0.01 * (lv - 1);
    if (q.id === 'healer') return d.radius + 0.01 * (lv - 1);
    if (q.id === 'magnet') return d.radius * (1 + 0.1 * (lv - 1));

    else if (id === 'barrier') { g.rect(x - s * 1.3, y - s * 0.6, s * 2.6, s * 1.2); }

    else if (id === 'healer') { g.moveTo(x - s, y); g.lineTo(x + s, y); g.moveTo(x, y - s); g.lineTo(x, y + s); g.rect(x - s, y - s, s * 2, s * 2); }
    else if (id === 'laser') { g.moveTo(x, y - s); g.lineTo(x + s, y); g.lineTo(x, y + s); g.lineTo(x - s, y); g.closePath(); g.moveTo(x, y); g.lineTo(x, y); }
    else if (id === 'magnet') { g.arc(x, y, s, Math.PI, 0); g.moveTo(x - s, y); g.lineTo(x - s, y + s); g.moveTo(x + s, y); g.lineTo(x + s, y + s); }
    else if (id === 'mortar') { g.arc(x, y + s * 0.3, s, Math.PI, 0); g.moveTo(x, y); g.lineTo(x + s * 0.6, y - s * 1.2); }
    else if (id === 'tesla') { g.moveTo(x, y - s * 1.2); g.lineTo(x - s * 0.5, y); g.lineTo(x + s * 0.5, y); g.lineTo(x, y + s * 1.2); }
    else if (id === 'decoy') { g.arc(x, y, s, 0, Math.PI * 2); g.moveTo(x + s * 0.4, y); g.arc(x, y, s * 0.4, 0, Math.PI * 2); }
    else if (id === 'amp') { for (var k = 0; k < 6; k++) { var b = k * Math.PI / 3; g[k ? 'lineTo' : 'moveTo'](x + Math.cos(b) * s, y + Math.sin(b) * s); } g.closePath(); }

  function drawTrial() {

      var d = TL.ENEMIES[e.type];
      var size = Math.max(2, e.r * U);
      g.globalAlpha = vis ? 1 : 0.12;
      g.strokeStyle = d.color; g.fillStyle = d.color; g.lineWidth = 1;
      g.save(); g.translate(Math.round(p[0]), Math.round(p[1])); g.rotate(Math.round((T.t * (e.boss ? 0.6 : 2) + e.id) * 4) / 4);

      else if (e.type === 'tera') { for (var s = 0; s < 3; s++) { var an = s * 2 * Math.PI / 3; g[s ? 'lineTo' : 'moveTo'](Math.cos(an) * size, Math.sin(an) * size); } g.closePath(); }
