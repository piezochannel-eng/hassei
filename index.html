<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#04060d">
<title>EMBRYO//GENESIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DotGothic16&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0c0c;
  --bg2: #141615;
  --panel: rgba(24, 26, 26, .38);
  --panel2: rgba(34, 36, 36, .28);
  --line: rgba(170, 185, 180, .38);
  --line2: rgba(170, 185, 180, .18);
  --cyan: #9fbdb8;
  --magenta: #a3808f;
  --violet: #8f88a3;
  --amber: #b8a27a;
  --red: #a9524c;
  --green: #8fa996;
  --text: #d6d8d2;
  --dim: #878b86;
  --holo: linear-gradient(90deg, rgba(159, 189, 184, .7), rgba(184, 162, 122, .5));
  --glow: none;
  --serif: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  --sans: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
  --mono: "DotGothic16", "MS Gothic", "Osaka-Mono", monospace;
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--text); font-family: var(--sans); -webkit-tap-highlight-color: transparent; }
body {
  margin: 0; padding: 0; overscroll-behavior: none; min-height: 100vh; overflow-x: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(40, 42, 40, .55), transparent 70%),
    radial-gradient(ellipse at 50% 120%, rgba(0, 0, 0, .8), transparent 60%),
    var(--bg);
}
#scan { position: fixed; inset: 0; pointer-events: none; z-index: 70; opacity: .16; mix-blend-mode: overlay; image-rendering: pixelated; background-size: 384px 384px; animation: grain .9s steps(1) infinite; }
@keyframes grain { 0% { background-position: 0 0; } 25% { background-position: -131px 77px; } 50% { background-position: 59px -173px; } 75% { background-position: -211px -38px; } }
body::after { content: ""; position: fixed; inset: 0; pointer-events: none; z-index: 69;
  background: repeating-linear-gradient(0deg, rgba(0, 0, 0, .22) 0 1px, transparent 1px 3px); }
button { font: inherit; color: inherit; cursor: pointer; }
.num { font-family: var(--mono); font-variant-numeric: tabular-nums; }
h3 { font-family: var(--serif); font-weight: 400; font-size: 12.5px; letter-spacing: .24em; margin: 20px 0 8px; color: var(--text); display: flex; align-items: center; gap: 8px; }
h3::before { content: ""; width: 14px; height: 2px; background: var(--holo); box-shadow: none; }
.hint { font-size: 12px; color: var(--dim); margin: 4px 0 10px; line-height: 1.7; }
.holo-text { background: var(--holo); -webkit-background-clip: text; background-clip: text; color: transparent; }

/* 枠(ホログラムの板) */
.card-ui, .fac, .upg, .perk, .drug, .osc, .card, .slot, .howto, .stats, .grade, .page, .rel, .sig, .bp-editor, .bp-board, #window, .act, .cursed {
  border: 1px solid var(--line); background: var(--panel);
  box-shadow: none;
}

/* ---------- 上の帯 ---------- */
#top { padding: 4px 2px 6px; }
.brand { display: flex; justify-content: space-between; align-items: center; }
.logo { font-family: var(--serif); font-size: 11px; letter-spacing: .32em; color: var(--dim); }
@keyframes hue { to { filter: hue-rotate(360deg); } }
.rank { font-family: var(--serif); font-size: 11px; letter-spacing: .2em; color: var(--dim); padding: 1px 2px; }
.row1 { display: flex; justify-content: space-between; align-items: baseline; margin-top: 2px; }
.stage { font-size: 12px; letter-spacing: .12em; color: var(--cyan); }
#cps { font-size: 12px; color: var(--dim); }
#cps.down { color: var(--red); }
.cells { font-size: 28px; font-weight: 400; line-height: 1.1; letter-spacing: .02em; }
.cells small { font-size: 12px; font-weight: 400; margin-left: 4px; color: var(--dim); font-family: var(--sans); }
.heat { margin-top: 6px; }
.heat .label { display: flex; justify-content: space-between; font-size: 11px; color: var(--dim); margin-bottom: 3px; letter-spacing: .06em; }
.heat .bar { position: relative; height: 8px; border: 1px solid var(--line); background: linear-gradient(90deg, rgba(159, 189, 184, .08) 0 40%, rgba(184, 162, 122, .12) 40% 70%, rgba(169, 82, 76, .16) 70%); }
.heat .bar i { position: absolute; top: -2px; bottom: -2px; width: 1px; background: var(--line); }
.heat .fill { position: absolute; left: 0; top: 0; bottom: 0; width: 0; background: var(--cyan); box-shadow: none;  }
.heat .fill.s1 { background: var(--amber); box-shadow: none; }
.heat .fill.s2, .heat .fill.s3 { background: var(--red); box-shadow: none; }
.heat .fill.s3 { animation: blink .5s steps(2) infinite; }
@keyframes blink { 50% { opacity: .35; } }
#status { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 6px; }
.chip { font-size: 10.5px; padding: 1px 7px; border: 1px solid var(--line); color: var(--text); letter-spacing: .04em; }
.chip.red { border-color: var(--red); color: var(--red); box-shadow: none; }
.chip.blue { border-color: var(--violet); color: var(--violet); }
.chip.yellow { border-color: var(--amber); color: var(--amber); }
.chip.green { border-color: var(--green); color: var(--green); }

/* ---------- 胚 ---------- */
#embryoWrap { position: relative; display: flex; justify-content: center; padding: 14px 16px 2px; }
#embryo { width: min(100%, 300px); aspect-ratio: 1; height: auto; display: block; cursor: pointer; touch-action: manipulation; user-select: none; -webkit-user-select: none;  }
#embryo:active { transform: scale(.97); }
.pop { position: absolute; pointer-events: none; font-family: var(--mono); font-size: 14px; color: var(--cyan); animation: pop .8s steps(4) forwards; }
@keyframes pop { to { transform: translateY(-50px); opacity: 0; } }
#clickInfo { text-align: center; font-size: 11px; color: var(--dim); letter-spacing: .1em; }

/* 声 */
#voice { position: absolute; left: 50%; top: 6px; transform: translateX(-50%); width: min(90%, 400px); padding: 10px 12px 8px; display: none; z-index: 5;
  border: 1px solid var(--cyan); background: rgba(16, 17, 17, .92); box-shadow: none; animation: drop .3s steps(4); }
#voice.show { display: block; }
#voice.has-card { border-color: var(--amber); box-shadow: none; }
#voice .who { font-size: 11px; color: var(--cyan); letter-spacing: .08em; display: flex; gap: 8px; align-items: center; }
#voice .who #voiceRole { color: var(--dim); }
#voice .vcard { display: none; margin-left: auto; color: var(--amber); border: 1px solid var(--amber); padding: 0 5px; font-size: 10px; }
#voice.has-card .vcard { display: inline-block; }
#voice .text { font-size: 14px; margin: 4px 0; line-height: 1.6; }
#voice .hint { font-size: 10.5px; color: var(--dim); display: flex; justify-content: space-between; margin: 0; }
#voice .timer { height: 2px; background: var(--holo); margin-top: 6px; }
@keyframes drop { from { transform: translate(-50%, -12px); opacity: 0; } }

/* 彼の声 */
#him { position: fixed; left: 0; right: 0; top: 38%; z-index: 60; text-align: center; pointer-events: none; font-family: var(--serif); font-size: 19px; letter-spacing: .4em; color: #d9d6cf; opacity: 0;
  text-shadow: none; font-weight: 300; padding: 0 16px; }
#him.show { animation: him 9s steps(4) forwards; text-shadow: none; }
@keyframes him {
  0% { opacity: 0; transform: translateY(6px);  }
  12% { opacity: .95; transform: none; filter: none; }
  14% { transform: translateX(3px); }
  15% { transform: translateX(-2px); }
  16% { transform: none; }
  75% { opacity: .85; }
  100% { opacity: 0;  }
}

/* 操作 */
#actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 8px 16px 10px; }
.act { padding: 8px 10px; text-align: left; position: relative; }
.act b { display: block; font-size: 13px; font-weight: 600; letter-spacing: .06em; }
.act span { font-size: 10.5px; color: var(--dim); }
.act.on { border-color: var(--violet); box-shadow: none; }
.act:disabled { opacity: .4; }
.act .cd { position: absolute; left: 0; bottom: 0; height: 2px; background: var(--red); box-shadow: none; }

/* 臨界期 */
#window { margin: 0 16px 10px; display: none; }
#window.show { display: block; }
#window.open { border-color: var(--amber); box-shadow: none; }
#window .head { display: flex; justify-content: space-between; padding: 6px 10px; font-size: 11px; letter-spacing: .1em; color: var(--amber); }
#window .body { padding: 0 10px 10px; font-size: 13px; }
#window .body p { margin: 2px 0 8px; font-size: 12px; color: var(--dim); }
#window.closed .body { display: none; }
#window.closed .head { color: var(--dim); }

/* ボタン共通 */
.btn, #window button, .fac .buy, .upg button, .perk button, .drug button, .osc button, .card button, .grade button, .danger, #modal button, #ending button, .seg button, .choices button, .bp-tools button {
  border: 1px solid var(--cyan); background: rgba(159, 189, 184, .08); color: var(--cyan); padding: 6px 10px; font-size: 12px; letter-spacing: .06em;
}
button:disabled { opacity: .35; }
#window button, .fac .buy { box-shadow: none; }

/* 切り替え */
.seg-row { display: flex; justify-content: space-between; gap: 8px; margin-bottom: 10px; flex-wrap: wrap; }
.seg { display: flex; }
.seg button { border-right-width: 0; color: var(--dim); border-color: var(--line); background: none; }
.seg button:last-child { border-right-width: 1px; }
.seg button.active { color: var(--text); background: rgba(159, 189, 184, .1); border-color: var(--dim); }
#panel-fac.selling .fac .buy { border-color: var(--amber); color: var(--amber); background: rgba(184, 162, 122, .08); }

/* 施設 */
.fac { margin-bottom: 8px; }
.fac .main { display: grid; grid-template-columns: 36px 1fr auto; gap: 10px; align-items: center; padding: 8px 10px; }
.fac .icon { width: 36px; height: 36px; }
.fac .name { font-size: 14px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.fac .count { font-family: var(--mono); font-size: 12px; color: var(--cyan); }
.fac .sub { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.5; }
.fac .buy { min-width: 86px; text-align: right; font-family: var(--mono); line-height: 1.25; }
.fac .buy small { display: block; font-size: 9.5px; font-family: var(--sans); color: var(--dim); }
.fac .more { display: none; border-top: 1px solid var(--line2); padding: 8px 10px; font-size: 12px; line-height: 1.7; color: var(--dim); }
.fac.open .more { display: block; }
.fac.locked { opacity: .45; }

/* 強化・装置・カード・薬 */
.upg, .perk, .drug, .osc, .card, .cursed { margin-bottom: 8px; padding: 8px 10px; display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; }
.upg .t, .perk .t, .drug .t, .osc .t, .cursed .t { font-size: 14px; }
.upg .e, .perk .e, .drug .e, .osc .e { font-size: 11.5px; color: var(--cyan); }
.upg .d, .perk .d, .drug .d, .osc .d, .cursed .d { font-size: 11px; color: var(--dim); margin-top: 2px; line-height: 1.6; }
.perk .lv { font-family: var(--mono); font-size: 11px; color: var(--magenta); margin-left: 6px; }
.osc .ctrl { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 4px; align-items: center; font-size: 11px; color: var(--dim); }
.osc .ctrl button { padding: 3px 8px; font-size: 11px; }
.osc .ctrl button.on, .choices button.on { background: var(--cyan); color: var(--bg); }
.cursed { border-color: rgba(169, 82, 76, .5); background: rgba(60, 10, 22, .35); }
.cursed .t { color: var(--red); }
.cursed button { border-color: var(--red); color: var(--red); background: rgba(169, 82, 76, .08); padding: 6px 10px; font-size: 12px; }
.cursed.taken { opacity: .8; }
.cursed .h { color: var(--red); font-size: 11px; margin-top: 3px; }
.owned { font-size: 12px; line-height: 1.8; color: var(--dim); }
.slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 6px; margin-bottom: 10px; }
.slot { min-height: 64px; padding: 6px; font-size: 11px; border-style: dashed; color: var(--dim); }
.slot.filled { border-style: solid; color: var(--text); box-shadow: none; }
.slot .e { color: var(--cyan); margin-top: 4px; }
.card .q { font-size: 13px; }
.card .k { font-size: 10px; letter-spacing: .1em; margin-right: 6px; padding: 0 5px; border: 1px solid var(--line); color: var(--dim); }
.card .k.dark { border-color: var(--red); color: var(--red); }
.card .k.spirit { border-color: var(--violet); color: var(--violet); }
.card .e { font-size: 11px; color: var(--cyan); margin-top: 2px; }
.card .btns { display: flex; gap: 4px; }
.card.on { border-color: var(--cyan); box-shadow: none; }
.card.dark-card .q { color: var(--red); }
#drugActive { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }

/* 写本 */
.howto { font-size: 12px; line-height: 1.8; padding: 8px 12px; color: var(--text); }
.howto p { margin: 4px 0; }
.howto b { color: var(--cyan); font-weight: 600; }
.rel { padding: 6px 10px; margin-bottom: 6px; display: grid; grid-template-columns: 26px 1fr; gap: 8px; align-items: center; font-size: 12px; }
.rel svg { width: 26px; height: 26px; }
.rel .tag { display: inline-block; margin: 2px 6px 0 0; padding: 0 5px; border: 1px solid var(--line); font-size: 10.5px; color: var(--text); }
.rel .tag.tg-emit { border-color: var(--cyan); color: var(--cyan); }
.rel .tag.tg-up { border-color: var(--green); color: var(--green); }
.rel .tag.tg-dn { border-color: var(--red); color: var(--red); }
.rel .tag.tg-win { border-color: var(--amber); color: var(--amber); }
.rel .tag.tg-cl { border-color: var(--violet); color: var(--violet); }
#pageList { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
.page { padding: 8px 10px; font-size: 12px; line-height: 1.7; min-height: 64px; }
.page .no { font-family: var(--mono); font-size: 10px; color: var(--magenta); letter-spacing: .12em; }
.page.missing { color: var(--dim); border-style: dashed; display: flex; align-items: center; justify-content: center; font-family: var(--mono); font-size: 11px; letter-spacing: .2em; }
.page.final { grid-column: 1 / -1; border-color: var(--magenta); box-shadow: none; text-align: center; font-size: 14px; }
.page.hint { border-color: rgba(184, 162, 122, .5); }

/* 記録 */
#wave svg { width: 100%; height: auto; display: block; border: 1px solid var(--line); background: rgba(16, 17, 17, .6); }
.legend { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; margin-top: 6px; color: var(--dim); }
.legend i { display: inline-block; width: 14px; height: 2px; vertical-align: middle; margin-right: 4px; }
.sigs { display: grid; grid-template-columns: repeat(auto-fill, minmax(96px, 1fr)); gap: 6px; }
.stats { width: 100%; border-collapse: collapse; font-size: 12px; }
.stats td { padding: 6px 10px; border-bottom: 1px solid var(--line2); }
.stats td:last-child { text-align: right; font-family: var(--mono); color: var(--cyan); }
.danger { margin-top: 12px; border-color: var(--red); color: var(--red); background: rgba(169, 82, 76, .06); }
.danger.armed { background: var(--red); color: var(--bg); }

/* 継代 */
.grade { padding: 12px; }
.grade .now { font-size: 22px; letter-spacing: .1em; }
.grade .units { font-size: 13px; color: var(--magenta); margin: 4px 0; }
.grade p { font-size: 12px; margin: 6px 0; line-height: 1.7; color: var(--dim); }
.grade button { border-color: var(--magenta); color: var(--magenta); background: rgba(163, 128, 143, .08); padding: 8px 14px; }
.grade button.armed { background: var(--magenta); color: var(--bg); }

/* 設計図 */
.bp-tools { display: flex; flex-wrap: wrap; gap: 4px; margin-bottom: 6px; align-items: center; }
.bp-tools button { color: var(--dim); border-color: var(--line); background: none; padding: 5px 9px; }
.bp-tools button.on { color: var(--bg); background: var(--cyan); border-color: var(--cyan); }
.bp-tools .sp { flex: 1; }
.bp-info { display: flex; flex-wrap: wrap; gap: 4px 12px; font-size: 11px; color: var(--dim); margin: 4px 0 8px; }
.bp-info b { color: var(--cyan); font-family: var(--mono); font-weight: 400; }
.bp-info .exp { color: var(--magenta); }
.bp-board { overflow: auto; -webkit-overflow-scrolling: touch; max-height: 70vh; padding: 0; }
.bp-board svg { display: block; touch-action: manipulation; user-select: none; -webkit-user-select: none; }
.bp-editor { border-top: none; padding: 8px 10px; font-size: 12px; min-height: 60px; }
.bp-editor p { margin: 4px 0; line-height: 1.6; }
.bp-editor .ed-head { font-size: 14px; color: var(--cyan); margin-bottom: 2px; letter-spacing: .06em; }
.bp-editor .err { color: var(--red); }
.bp-editor .desc { color: var(--dim); }
.choices { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; margin: 6px 0; }
.choices button { padding: 4px 8px; font-size: 12px; }
.ax-r { color: #a8706a; } .ax-b { color: #86a0b3; } .ax-y { color: var(--amber); } .ax-v { color: #9c514b; }

/* 通知(演出つき) */
#toasts { position: fixed; right: 16px; bottom: 72px; width: min(360px, calc(100% - 32px)); z-index: 85; display: flex; flex-direction: column; gap: 8px; pointer-events: none; }
.toast { position: relative; display: grid; grid-template-columns: 22px 1fr; gap: 10px; align-items: center; overflow: hidden;
  background: rgba(18, 19, 19, .94); color: var(--text); padding: 10px 12px 12px; font-size: 12.5px; line-height: 1.5;
  border: 1px solid rgba(159, 189, 184, .45); box-shadow: none;
  animation: tin .6s steps(4) both; --c: var(--cyan); }
.toast::before { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255, 255, 255, .06), transparent); transform: translateX(-100%); animation: sweep 1.6s .1s steps(4); pointer-events: none; }
.toast::after { content: ""; position: absolute; left: 0; bottom: 0; height: 2px; width: 100%; background: var(--c); box-shadow: none; transform-origin: left; animation: life var(--life, 4.2s) steps(4) forwards; }
.toast .ic { width: 22px; height: 22px; color: var(--c); }
.toast .ic svg { width: 22px; height: 22px; display: block; }
.toast.out { animation: tout .35s steps(4) forwards; }
.toast.red { --c: var(--red); border-color: rgba(169, 82, 76, .55); }
.toast.blue { --c: var(--violet); border-color: rgba(143, 136, 163, .55); }
.toast.gold { --c: var(--amber); border-color: rgba(184, 162, 122, .55); }
.toast.dark { --c: var(--magenta); border-color: rgba(163, 128, 143, .6); color: #ddd0d2; }
.toast.dark .tx { text-shadow: none; }
@keyframes tin { 0% { opacity: 0; transform: translateY(6px);  } 100% { opacity: 1; transform: none; filter: none; } }
@keyframes tout { to { opacity: 0;  } }
@keyframes sweep { to { transform: translateX(100%); } }
@keyframes life { from { transform: scaleX(1); } to { transform: scaleX(0); } }

/* モーダルと結末 */
#modal { position: fixed; inset: 0; background: rgba(2, 4, 10, .7); display: none; align-items: center; justify-content: center; z-index: 80; padding: 16px; }
#modal.show { display: flex; }
#modal .box { background: rgba(18, 19, 19, .96); border: 1px solid var(--cyan); box-shadow: none; padding: 16px; width: min(100%, 400px); }
#modal h2 { margin: 0 0 8px; font-size: 16px; letter-spacing: .12em; color: var(--cyan); font-weight: 500; }
#modal p { margin: 4px 0; font-size: 13px; line-height: 1.7; }
#modal button { margin-top: 12px; }
#ending { position: fixed; inset: 0; z-index: 90; background: #000; display: none; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center; }
#ending.show { display: flex; }
#endingCanvas { width: min(56vh, 80vw); height: min(56vh, 80vw); opacity: 0; animation: ein 6s steps(4) forwards; }
#ending .lines p { opacity: 0; margin: 8px 0; font-family: var(--serif); font-size: 15px; letter-spacing: .2em; line-height: 1.9; color: #bdbab2; animation: ein 2.4s steps(4) forwards; }
#ending .lines p:last-child { font-size: 17px; color: #e6e2d8; }
@keyframes ein { to { opacity: 1; } }
#ending button { margin-top: 20px; opacity: 0; animation: ein 2s steps(4) forwards; border-color: var(--line); color: var(--dim); background: none; padding: 8px 18px; }

/* ---------- 小窓(PC) ---------- */
#desk { position: relative; }
.win { display: block; }
.win-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 7px 12px; font-family: var(--serif); font-size: 12px; letter-spacing: .2em; color: var(--text);
  border-bottom: 1px solid var(--line); background: rgba(255, 255, 255, .02); user-select: none; -webkit-user-select: none; }
.win-t .logo { font-size: 10px; }
.win-x { border: none; background: none; color: var(--dim); font-size: 16px; line-height: 1; padding: 0 4px; }
.win-x:hover { color: var(--red); }
.win-b { padding: 10px 12px 14px; }

@media (min-width: 900px) {
  body { height: 100vh; overflow: hidden; }
  #desk { position: fixed; inset: 0 0 52px 0; overflow: hidden; }
  .win { position: absolute; border: 1px solid var(--line); background: rgba(16, 17, 17, .82);
    box-shadow: none;
    display: flex; flex-direction: column; resize: both; overflow: hidden; min-width: 260px; min-height: 160px; animation: winin .35s steps(4); }
  .win.closed { display: none; }
  .win.focus { border-color: rgba(159, 189, 184, .7); box-shadow: none; }

<script>
/*
 * 設計図(マス目式)の計算部分
 *   体の形をしたマス目の盤面に、原基を置き、血管を引いて流れを器官へ届ける。
 *   流れは設計図の中だけのもので、頭尾(r)・背腹(b)・左右(y)・血流(v)の4つの軸の整数の量。
 *   血流は心臓だけがつくる。器官の中には、完成するとほかの器官へ何かを送り出すものがある。
 *   画面にもゲーム本体にも依存しない。
 */
var Blueprint = (function () {
  'use strict';

  var AXES = ['r', 'b', 'y', 'v'];
  var AXIS_NAMES = { r: '頭尾', b: '背腹', y: '左右', v: '血流' };

  /* ---------- 盤面 ----------
   * 文字: ' ' 体の外 / a 胸 / b 頸 / c 腹 / d 四肢 / e 骨盤 / f 頭 / g 封印の内側 / x 封印の壁(封印が解けると通れる)
   */
  var MAP = [
    '      fffffff      ',
    '    fffffffffff    ',
    '   fffffffffffff   ',
    '   fffffffffffff   ',
    '   fffffffffffff   ',
    '    fffffffffff    ',
    '      fffffff      ',
    '      bbbbbbb      ',
    '     bbbbbbbbb     ',
    '    bbbbbbbbbbb    ',
    '   aaaaaaaaaaaaa   ',
    'dddaaaaaaaaaaaaaddd',
    'dddaaaaaaaaaaaaaddd',
    'ddd aaaaaaaaaaa ddd',
    'dd  aaaaaaaaaaa  dd',
    'dd  aaaaaaaaaaa  dd',
    'dd  aaaaaaaaaaa  dd',
    'd  ccccccccccccc  d',
    'd  ccccccccccccc  d',
    '   ccccccccccccc   ',
    '   ccccccccccccc   ',
    '   ccccccccccccc   ',
    '   ccccccccccccc   ',
    '   eeeeeeeeeeeee   ',
    '   eeeexxxxxeeee   ',
    '   eeeexgggxeeee   ',
    '  deeeexgggxeeeed  ',
    ' ddeeeexgggxeeeedd ',
    ' ddeeeexxxxxeeeedd ',
    'ddd eeeeeeeeeee ddd',
    'ddd   eeeeeee   ddd',
    'dd     eeeee     dd',
    'dd      eee      dd',
  ];
  var W = MAP[0].length, H = MAP.length;

  // 区画: 開く順。unlock は開く条件(ゲーム本体が判定する)
  var ZONES = [
    { id: 'a', name: '胸', unlock: { always: true } },
    { id: 'b', name: '頸', unlock: { lifetime: 1e11 } },
    { id: 'c', name: '腹', unlock: { lifetime: 1e13 } },
    { id: 'd', name: '四肢', unlock: { lifetime: 1e15 } },
    { id: 'e', name: '骨盤', unlock: { lifetime: 1e18 } },
    { id: 'f', name: '頭', unlock: { lifetime: 1e21 } },
    { id: 'g', name: '封印', unlock: { final: true } },
  ];
  var ZONE_BY_ID = {};
  ZONES.forEach(function (z, i) { z.index = i; ZONE_BY_ID[z.id] = z; });

  function zoneAt(x, y) {
    if (y < 0 || y >= H || x < 0 || x >= W) return null;
    var ch = MAP[y].charAt(x);
    if (ch === ' ') return null;
    return ch === 'x' ? 'g' : ch;
  }
  function key(x, y) { return x + ',' + y; }
  function parseKey(k) { var p = k.split(','); return [Number(p[0]), Number(p[1])]; }

  /* ---------- 器官 ----------
   * target : 目標の流れ
   * show   : 画面に見せる軸(省略で全部隠す)
   * weight : 設計図全体の倍率(指数)への重み
   * link   : 倍率がかかる上位の施設
   * product: 完成度の段階ごとに送り出すもの(段階1,2,3)
   * special: ゲーム本体への特別な役割(本体が解釈する)
   */
  var ORGANS = [
    { id: 'heart', name: '心臓', x: 9, y: 13, target: { r: 2, b: 0, y: 0, v: 0 }, show: ['r', 'b', 'y', 'v'], weight: 0.5, link: 'heart',
      product: [{ v: 1 }, { v: 2 }, { v: 4 }], role: '完成させるほど、血流を送り出す。' },
    { id: 'thymus', name: '胸腺', x: 9, y: 11, target: { r: 0, b: 1, y: 0, v: 1 }, show: ['r', 'b', 'y', 'v'], weight: 0.5,
      special: 'cardSlot', role: 'カードの枠が増える。' },
    { id: 'thyroid', name: '甲状腺', x: 9, y: 8, target: { r: 1, b: 1, y: 0, v: 1 }, show: ['r', 'b'], weight: 1,
      special: 'cooling', role: 'ヒートが冷めやすくなる。' },
    { id: 'arch', name: '咽頭弓', x: 6, y: 9, target: { r: 1, b: 0, y: -2, v: 0 }, show: ['r', 'b'], weight: 1, link: 'pharyngeal',
      role: '咽頭弓(施設)が伸びる。' },
    { id: 'liver', name: '肝臓', x: 6, y: 19, target: { r: 2, b: 1, y: -1, v: 1 }, show: ['v'], weight: 1.25,
      product: [{}, { r: 1, b: 1 }, { r: 2, b: 2 }], special: 'clearRA', role: '完成させると栄養(頭尾と背腹)を送り出す。レチノイン酸を分解する。' },
    { id: 'kidneyL', name: '左腎', x: 5, y: 21, target: { r: 1, b: 1, y: 1, v: 1 }, weight: 1.25, special: 'clearWnt', role: 'Wntを濾し取る。' },
    { id: 'kidneyR', name: '右腎', x: 13, y: 21, target: { r: 1, b: 1, y: -1, v: 1 }, weight: 1.25, special: 'clearWnt', role: 'Wntを濾し取る。' },
    { id: 'armL', name: '左上肢', x: 0, y: 12, target: { r: 2, b: 0, y: 1, v: 1 }, weight: 1.25, link: 'limb', role: '肢芽(施設)が伸びる。' },
    { id: 'armR', name: '右上肢', x: 18, y: 12, target: { r: 2, b: 0, y: -1, v: 1 }, weight: 1.25, link: 'limb', role: '肢芽(施設)が伸びる。' },
    { id: 'legL', name: '左下肢', x: 0, y: 31, target: { r: 1, b: 1, y: 2, v: 0 }, weight: 1.25, link: 'limb', role: '肢芽(施設)が伸びる。' },
    { id: 'legR', name: '右下肢', x: 18, y: 31, target: { r: 1, b: 1, y: -2, v: 0 }, weight: 1.25, link: 'limb', role: '肢芽(施設)が伸びる。' },
    { id: 'gonad', name: '生殖腺', x: 5, y: 26, target: { r: 0, b: 3, y: 0, v: 2 }, weight: 1.5, special: 'residue', role: '継代でもらえる残滓が増える。' },
    { id: 'adrenal', name: '副腎', x: 13, y: 26, target: { r: 3, b: 0, y: 1, v: 1 }, weight: 1.5, special: 'drug', role: '薬が長く効く。' },
    { id: 'tail', name: '尾', x: 9, y: 32, target: { r: 4, b: 1, y: 0, v: 0 }, weight: 1.5, link: 'tailbud', role: '尾芽(施設)が伸びる。' },
    { id: 'brain', name: '脳', x: 9, y: 1, target: { r: 5, b: 3, y: 0, v: 2 }, weight: 2, special: 'tap', role: 'タップが強くなる。' },
    { id: 'pineal', name: '松果体', x: 9, y: 4, target: { r: 0, b: 0, y: 0, v: 2 }, weight: 2, special: 'offline', role: '閉じている間に育つ時間が延びる。' },
  ];
  var ALTAR = { id: 'altar', name: '祭壇', x: 9, y: 26 };
  var ORGAN_BY_ID = {};
  var ORGAN_AT = {};
  ORGANS.forEach(function (o) { o.zone = zoneAt(o.x, o.y); ORGAN_BY_ID[o.id] = o; ORGAN_AT[key(o.x, o.y)] = o; });

  /* ---------- 原基 ---------- */
  var PIECES = [
    { id: 'node', name: '原始結節', short: '結節', emit: { r: 2, y: 1 }, desc: '入ってきた流れに、頭尾2と左右1を足す。' },
    { id: 'somite', name: '体節', short: '体節', facility: 'somite', perLevel: { r: 1 }, maxLevel: 6, desc: '頭尾を段階の数だけ足す。体節を10個回すごとに1段階。' },
    { id: 'notochord', name: '脊索', short: '脊索', facility: 'notochord', perLevel: { b: 1 }, maxLevel: 6, desc: '背腹を段階の数だけ足す。脊索を10個回すごとに1段階。' },
    { id: 'lateral', name: '側板', short: '側板', facility: 'lateral', perLevel: { y: 1 }, maxLevel: 6, desc: '左右を段階の数だけ足す。側板中胚葉を10個回すごとに1段階。' },
    { id: 'relay', name: '中継', short: '中継', op: 'pass', desc: '受け取った流れを、そのまま次へ。枝分かれさせたいときに。' },
    { id: 'growth', name: '増殖帯', short: '増殖', op: 'double', desc: '受け取った流れを、すべて2倍にする。' },
    { id: 'twist', name: 'ねじれ', short: 'ねじ', op: 'swap', desc: '頭尾と背腹を入れ替える。' },
    { id: 'halve', name: '間引き', short: '間引', op: 'halve', desc: 'すべてを半分にする(0に向かって切り捨て)。' },
    { id: 'theOne', name: 'the one', short: 'ONE', op: 'one', altarOnly: true, desc: 'あなたのすべて。' },
  ];
  var PIECE_BY_ID = {};
  PIECES.forEach(function (p) { PIECE_BY_ID[p.id] = p; });
  var FACILITY_PER_LEVEL = 10;

  /* ---------- 血管の途中に付けるもの ---------- */
  var MODS = [
    { id: 'mirror', name: '鏡像', desc: '左右の向きを反対にする。' },
    { id: 'only_r', name: '頭尾だけ通す', axis: 'r', desc: '頭尾のほかは捨てる。' },
    { id: 'only_b', name: '背腹だけ通す', axis: 'b', desc: '背腹のほかは捨てる。' },
    { id: 'only_y', name: '左右だけ通す', axis: 'y', desc: '左右のほかは捨てる。' },
    { id: 'only_v', name: '血流だけ通す', axis: 'v', desc: '血流のほかは捨てる。' },
  ];
  var MOD_BY_ID = {};
  MODS.forEach(function (m) { MOD_BY_ID[m.id] = m; });

  /* ---------- 区画ごとに増える道具 ----------
   * 開いている区画の数(胸だけなら1)で決まる
   */
  function toolsFor(openCount, extra) {
    extra = extra || {};
    var t = {
      branch: openCount >= 6 ? 4 : openCount >= 4 ? 3 : openCount >= 2 ? 2 : 1,
      bridges: openCount >= 6 ? 16 : openCount >= 5 ? 10 : openCount >= 3 ? 4 : 0,
      mods: { mirror: openCount >= 2, only_r: openCount >= 3, only_b: openCount >= 3, only_y: openCount >= 3, only_v: openCount >= 3 },
      limits: { node: openCount >= 5 ? 2 : 1, growth: 1 + openCount, twist: openCount >= 2 ? openCount : 0, halve: openCount >= 3 ? openCount - 1 : 0, relay: Infinity, theOne: extra.theOne ? 1 : 0 },
    };
    return t;
  }

  /* ---------- 計算の小道具 ---------- */
  function vec(o) { return { r: (o && o.r) || 0, b: (o && o.b) || 0, y: (o && o.y) || 0, v: (o && o.v) || 0 }; }
  function add(a, b) { return { r: a.r + b.r, b: a.b + b.b, y: a.y + b.y, v: a.v + b.v }; }
  function isZero(a) { return !a.r && !a.b && !a.y && !a.v; }
  function splitInt(v, n) {
    var base = v >= 0 ? Math.floor(v / n) : -Math.floor(-v / n);
    var rem = v - base * n;
    var out = [];
    var sign = rem >= 0 ? 1 : -1;
    for (var i = 0; i < n; i++) out.push(base + (i < Math.abs(rem) ? sign : 0));
    return out;
  }
  function splitVec(v, n) {
    var parts = [];
    for (var i = 0; i < n; i++) parts.push(vec());
    AXES.forEach(function (a) { splitInt(v[a], n).forEach(function (x, i) { parts[i][a] = x; }); });
    return parts;
  }
  function trunc2(x) { return x >= 0 ? Math.floor(x / 2) : -Math.floor(-x / 2); }

  var CLOSENESS = [1, 0.8, 0.5, 0.3, 0.15, 0.07, 0.03];
  function completion(input, target) {
    var c = 1;
    AXES.forEach(function (a) { c *= CLOSENESS[Math.min(Math.abs(input[a] - target[a]), CLOSENESS.length - 1)]; });
    return c;
  }
  /** 完成度の段階: 0(50%未満) 1(50%以上) 2(75%以上) 3(ぴったり) */
  function tierOf(c) { return c >= 0.999 ? 3 : c >= 0.75 ? 2 : c >= 0.5 ? 1 : 0; }
  var TIER_SCORE = [0, 0.25, 0.5, 1];

  /** 上位の施設への倍率(前の版と同じ考え方。閾値でぐっと上がる) */
  var UNCONNECTED = 0.02;
  var TIERS = [{ at: 0.5, mult: 1.5 }, { at: 0.75, mult: 2 }, { at: 0.999, mult: 2 }];
  function tierMult(c) {
    var m = 0.05 + 0.45 * c;
    TIERS.forEach(function (t) { if (c >= t.at) m *= t.mult; });
    return m;
  }

  /* ---------- 評価 ----------
   * config: { tiles: { 'x,y': { id, level? } }, vessels: [{ from: 'x,y', to: 'x,y', cells: [[x,y]...], mods: { index: modId } }] }
   * ctx   : { zoneOpen(z), tools (toolsFor の結果), facilityOwned(fid) }
   * 返り値: { inputs, outputs, organs, levels, errors: { 'x,y' | 'v<番号>': 文 }, vesselOk: [bool], arrivals: [vec], score }
   */
  function evaluate(config, ctx) {
    ctx = ctx || {};
    var zoneOpen = ctx.zoneOpen || function () { return true; };
    var tools = ctx.tools || toolsFor(6, { theOne: true });
    var facilityOwned = ctx.facilityOwned || function () { return Infinity; };
    var tiles = (config && config.tiles) || {};
    var vessels = (config && config.vessels) || [];
    var errors = {};

    function cellFree(x, y) {
      var z = zoneAt(x, y);
      if (!z || !zoneOpen(z)) return false;
      var k = key(x, y);
      if (ORGAN_AT[k] || (x === ALTAR.x && y === ALTAR.y)) return false;
      return !tiles[k];
    }

    // 原基
    var used = {}, facilityLeft = {}, levels = {}, active = {};
    Object.keys(tiles).forEach(function (k) {
      var p = tiles[k];
      var xy = parseKey(k);
      var def = PIECE_BY_ID[p.id];
      if (!def) { errors[k] = '知らない原基'; return; }
      var z = zoneAt(xy[0], xy[1]);
      var onAltar = xy[0] === ALTAR.x && xy[1] === ALTAR.y;
      if (!z || !zoneOpen(z)) { errors[k] = 'まだ開いていない場所'; return; }
      if (ORGAN_AT[k]) { errors[k] = '器官の上には置けない'; return; }
      if (onAltar !== !!def.altarOnly) { errors[k] = onAltar ? '祭壇には、ふさわしいものしか置けない' : 'これは祭壇にしか置けない'; return; }
      used[p.id] = (used[p.id] || 0) + 1;
      var lim = def.facility ? Infinity : (tools.limits[p.id] === undefined ? Infinity : tools.limits[p.id]);
      if (used[p.id] > lim) { errors[k] = def.name + 'はこれ以上置けない'; return; }
      if (def.facility) {
        var want = Math.max(1, Math.min(def.maxLevel, Math.floor(p.level || 1)));
        if (facilityLeft[def.facility] === undefined) facilityLeft[def.facility] = facilityOwned(def.facility);
        var can = Math.max(0, Math.min(want, Math.floor(facilityLeft[def.facility] / FACILITY_PER_LEVEL)));
        if (can < want) errors[k] = '施設が足りず、' + can + '段階しか出せない';
        facilityLeft[def.facility] -= can * FACILITY_PER_LEVEL;
        levels[k] = can;
      }
      active[k] = def;
    });

    // 血管
    var occupancy = {};       // 'x,y' -> [{ vi, dir: 'h'|'v'|'turn' }]
    var vesselOk = [];
    var outCount = {};
    function endpointKind(k, asSource) {
      if (active[k]) return active[k].altarOnly ? null : 'part';
      var o = ORGAN_AT[k];
      if (o && zoneOpen(o.zone)) return asSource ? (o.product ? 'organ' : null) : 'organ';
      return null;
    }
    function adjacent(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1; }
    vessels.forEach(function (vs, i) {
      var ek = 'v' + i;
      vesselOk[i] = false;
      if (!endpointKind(vs.from, true)) { errors[ek] = '始点から流れが出ない'; return; }
      if (!endpointKind(vs.to, false)) { errors[ek] = '終点が受け取れない'; return; }
      if (vs.from === vs.to) { errors[ek] = '同じところへは引けない'; return; }
      var cells = vs.cells || [];
      var a = parseKey(vs.from), b = parseKey(vs.to);
      if (cells.length === 0) { if (!adjacent(a, b)) { errors[ek] = 'つながっていない'; return; } }
      else {
        if (!adjacent(a, cells[0]) || !adjacent(cells[cells.length - 1], b)) { errors[ek] = '端がつながっていない'; return; }
        for (var c = 0; c < cells.length; c++) {
          if (c > 0 && !adjacent(cells[c - 1], cells[c])) { errors[ek] = '途中で切れている'; return; }
          if (!cellFree(cells[c][0], cells[c][1])) { errors[ek] = '通れないマスを通っている'; return; }
        }
      }
      var cap = tools.branch;
      outCount[vs.from] = (outCount[vs.from] || 0) + 1;
      if (outCount[vs.from] > cap) { errors[ek] = '1つの始点から引けるのは' + cap + '本まで'; return; }
      // 直進か曲がりかを記録(交差の判定用)
      var pts = [a].concat(cells).concat([b]);
      cells.forEach(function (cc, j) {
        var p0 = pts[j], p2 = pts[j + 2];
        var dir = p0[1] === p2[1] ? 'h' : p0[0] === p2[0] ? 'v' : 'turn';
        var kk = key(cc[0], cc[1]);
        (occupancy[kk] = occupancy[kk] || []).push({ vi: i, dir: dir, mod: vs.mods && vs.mods[j] });
      });
      vesselOk[i] = true;
    });
    // 重なりの判定: 2本が直角に交わる場合だけ、交差として許す(数に上限)
    var crossings = 0;
    Object.keys(occupancy).forEach(function (kk) {
      var occ = occupancy[kk];
      if (occ.length < 2) return;
      var okCross = occ.length === 2 && occ[0].dir !== 'turn' && occ[1].dir !== 'turn' && occ[0].dir !== occ[1].dir && !occ[0].mod && !occ[1].mod;
      if (okCross && crossings < tools.bridges) { crossings++; return; }
      occ.slice(1).forEach(function (o) {
        if (vesselOk[o.vi]) { vesselOk[o.vi] = false; errors['v' + o.vi] = okCross ? '交差できるのは' + tools.bridges + 'か所まで' : 'ほかの血管と重なっている'; }
      });
    });
    // 付けたものが使えるか
    vessels.forEach(function (vs, i) {
      if (!vesselOk[i]) return;
      Object.keys(vs.mods || {}).forEach(function (j) {
        var m = vs.mods[j];
        if (!MOD_BY_ID[m] || !tools.mods[m]) { vesselOk[i] = false; errors['v' + i] = (MOD_BY_ID[m] ? MOD_BY_ID[m].name : '知らないもの') + 'はまだ使えない'; }
      });
    });

    // 流れの順番(原基と器官をまとめて並べる)
    var nodes = Object.keys(active).filter(function (k) { return !active[k].altarOnly; });
    ORGANS.forEach(function (o) { if (zoneOpen(o.zone)) nodes.push(key(o.x, o.y)); });
    var indeg = {};
    nodes.forEach(function (k) { indeg[k] = 0; });
    var edges = [];
    vessels.forEach(function (vs, i) {
      if (!vesselOk[i] || indeg[vs.from] === undefined || indeg[vs.to] === undefined) return;
      edges.push({ i: i, from: vs.from, to: vs.to, vs: vs });
      indeg[vs.to]++;
    });
    var order = [], queue = nodes.filter(function (k) { return indeg[k] === 0; });
    while (queue.length) {
      var k0 = queue.shift();
      order.push(k0);
      edges.forEach(function (e) { if (e.from === k0) { indeg[e.to]--; if (indeg[e.to] === 0) queue.push(e.to); } });
    }
    var cycle = nodes.filter(function (k) { return order.indexOf(k) === -1; });
    cycle.forEach(function (k) { if (!errors[k]) errors[k] = '流れが輪になっていて、流れない'; });

    var inputs = {}, outputs = {}, arrivals = [], organs = {};
    nodes.forEach(function (k) { inputs[k] = vec(); });
    function runNode(k) {
      var x = inputs[k];
      var def = active[k];
      if (def) {
        if (def.emit) return add(x, vec(def.emit));
        if (def.perLevel) {
          var lv = levels[k] || 0, e = vec(def.perLevel);
          return { r: x.r + e.r * lv, b: x.b + e.b * lv, y: x.y + e.y * lv, v: x.v + e.v * lv };
        }
        if (def.op === 'double') return { r: x.r * 2, b: x.b * 2, y: x.y * 2, v: x.v * 2 };
        if (def.op === 'swap') return { r: x.b, b: x.r, y: x.y, v: x.v };
        if (def.op === 'halve') return { r: trunc2(x.r), b: trunc2(x.b), y: trunc2(x.y), v: trunc2(x.v) };
        return vec(x);
      }
      var o = ORGAN_AT[k];
      var c = completion(x, vec(o.target));
      var t = tierOf(c);
      organs[o.id] = { input: x, c: c, tier: t, open: true, empty: isZero(x) };
      return o.product && t > 0 ? vec(o.product[t - 1]) : vec();
    }
    order.forEach(function (k) {
      outputs[k] = runNode(k);
      var outs = edges.filter(function (e) { return e.from === k; });
      if (!outs.length) return;
      var parts = splitVec(outputs[k], outs.length);
      outs.forEach(function (e, n) {
        var f = parts[n];
        var mods = e.vs.mods || {};
        (e.vs.cells || []).forEach(function (cc, j) {
          var m = mods[j];
          if (!m) return;
          if (m === 'mirror') f = { r: f.r, b: f.b, y: -f.y, v: f.v };
          else if (MOD_BY_ID[m].axis) { var only = vec(); only[MOD_BY_ID[m].axis] = f[MOD_BY_ID[m].axis]; f = only; }
        });
        arrivals[e.i] = f;
        inputs[e.to] = add(inputs[e.to], f);
      });
    });
    cycle.forEach(function (k) { outputs[k] = vec(); });
    ORGANS.forEach(function (o) {
      if (organs[o.id]) return;
      var open = zoneOpen(o.zone);
      organs[o.id] = { input: vec(), c: 0, tier: 0, open: open, empty: true };
    });
    // 何も届いていない器官は数えない
    ORGANS.forEach(function (o) { var r = organs[o.id]; if (r.empty) { r.c = 0; r.tier = 0; } });

    var score = 0;
    ORGANS.forEach(function (o) { if (organs[o.id].open) score += o.weight * TIER_SCORE[organs[o.id].tier]; });
    var theOne = tiles[key(ALTAR.x, ALTAR.y)];
    return {
      inputs: inputs, outputs: outputs, organs: organs, levels: levels, errors: errors, vesselOk: vesselOk, arrivals: arrivals,
      crossings: crossings, cycle: cycle, score: score,
      altar: !!(theOne && theOne.id === 'theOne' && !errors[key(ALTAR.x, ALTAR.y)]),
    };
  }

  /* ---------- 自動で血管の道を探す ----------
   * from と to(どちらも 'x,y')の間の、いちばん短い道を探す。
   * 既存の血管とは、まっすぐ直角に交わる場合だけ交差できる(上限あり)。
   */
  function route(config, ctx, from, to) {
    ctx = ctx || {};
    var zoneOpen = ctx.zoneOpen || function () { return true; };
    var tools = ctx.tools || toolsFor(6);
    var tiles = config.tiles || {};
    var vessels = config.vessels || [];
    var occ = {};
    vessels.forEach(function (vs, i) {
      var a = parseKey(vs.from), b = parseKey(vs.to);
      var pts = [a].concat(vs.cells || []).concat([b]);
      (vs.cells || []).forEach(function (cc, j) {
        var p0 = pts[j], p2 = pts[j + 2];
        var dir = p0[1] === p2[1] ? 'h' : p0[0] === p2[0] ? 'v' : 'turn';
        var k = key(cc[0], cc[1]);
        (occ[k] = occ[k] || []).push({ dir: dir, mod: vs.mods && vs.mods[j] });
      });
    });
    var crossingsUsed = 0;
    Object.keys(occ).forEach(function (k) { if (occ[k].length === 2) crossingsUsed++; });
    var crossLeft = tools.bridges - crossingsUsed;
    function free(x, y) {
      var z = zoneAt(x, y);
      if (!z || !zoneOpen(z)) return false;
      var k = key(x, y);
      if (ORGAN_AT[k] || (x === ALTAR.x && y === ALTAR.y) || tiles[k]) return false;
      return true;
    }
    var a = parseKey(from), b = parseKey(to);
    if (Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) === 1) return [];
    var DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
    // 状態: x, y, 来た向き, 使った交差の数
    var start = [];
    DIRS.forEach(function (d, di) {
      var x = a[0] + d[0], y = a[1] + d[1];
      if (free(x, y) && !occ[key(x, y)]) start.push({ x: x, y: y, di: di, cross: 0, prev: null });
    });
    var seen = {};
    var q = start.slice();
    start.forEach(function (s) { seen[s.x + ',' + s.y + ',' + s.di + ',' + s.cross] = true; });
    while (q.length) {
      var s = q.shift();
      // ゴールのとなりに来たか(交差のマスで終わることはできない)
      if (!occ[key(s.x, s.y)] && Math.abs(s.x - b[0]) + Math.abs(s.y - b[1]) === 1) {
        var path = [];
        for (var t = s; t; t = t.prev) path.unshift([t.x, t.y]);
        return path;
      }
      for (var di = 0; di < 4; di++) {
        var d = DIRS[di];
        var nx = s.x + d[0], ny = s.y + d[1];
        if (!free(nx, ny)) continue;
        var o = occ[key(nx, ny)];
        var cross = s.cross;
        // 交差のマスからは、まっすぐにしか出られない
        if (occ[key(s.x, s.y)] && di !== s.di) continue;
        if (o) {
          var myDir = d[1] === 0 ? 'h' : 'v';
          if (o.length !== 1 || o[0].dir === 'turn' || o[0].dir === myDir || o[0].mod) continue;
          cross++;
          if (cross > crossLeft) continue;
        }
        var sk = nx + ',' + ny + ',' + di + ',' + cross;
        if (seen[sk]) continue;
        seen[sk] = true;
        q.push({ x: nx, y: ny, di: di, cross: cross, prev: s });
      }
    }
    return null;
  }

  return {
    AXES: AXES, AXIS_NAMES: AXIS_NAMES, MAP: MAP, W: W, H: H, ZONES: ZONES, ZONE_BY_ID: ZONE_BY_ID, ORGANS: ORGANS, ORGAN_BY_ID: ORGAN_BY_ID,

  /* ---------- 傷 ---------- */

    T.drops.push({ id: T.nextId++, x: e.x, y: e.y, food: d.food * foodPer(n) * (T.stats.foodMult || 1), shard: d.shard * shardPer(n), big: e.boss, age: 0 });
    if (d.split) for (var i = 0; i < d.split; i++) spawn(T, 'bact', [e.x + (T.rand() - 0.5) * 0.06, e.y + (T.rand() - 0.5) * 0.06], e.maxHp * 0.35);

  function damageHim(T, amount) {

  function nearestEnemy(T, x, y, range, mode) {

  function inRadius(T, x, y, r, fn) {

  /* ---------- 1歩 ---------- */
  function step(T, dt) {
    if (T.over) return;
    T.t += dt;
    var h = T.him;
    // him の移動(準備中も動ける)
    var mx = T.move.x, my = T.move.y;
    if (T.goal) {
      var gx = T.goal.x - h.x, gy = T.goal.y - h.y, gl = Math.sqrt(gx * gx + gy * gy);
      if (gl > 0.01) { mx = gx / gl; my = gy / gl; } else { mx = 0; my = 0; }
    }
    var ml = Math.sqrt(mx * mx + my * my);
    if (ml > 0) { var sp = himSpeed(T) * dt; h.x = clamp(h.x + mx / ml * sp, -0.97, 0.97); h.y = clamp(h.y + my / ml * sp, -0.97, 0.97); }

    h.inv = Math.max(0, h.inv - dt);
    // 拾う

    T.drops.forEach(function (dr) { if (!dr.got && d2(dr.x, dr.y, h.x, h.y) <= pr2) collect(T, dr, 'him'); });

    T.drops = T.drops.filter(function (dr) { return !dr.got; });

    if (T.phase === 'prep') return;

    // 波の進行

      if (T.spawnLeft > 0) {

      } else if (T.enemies.length === 0) {
        T.cleared = T.round;

        T.food += Math.ceil(b.food * (T.stats.foodMult || 1));
        T.shards += b.shards;
        T.phase = 'collect'; T.phaseT = 4;
        T.events.push({ type: 'cleared', round: T.round, food: b.food, shards: b.shards });
      }
    } else if (T.phase === 'collect') {

    // 気力・回復

    h.hp = Math.min(h.maxHp, h.hp + ((T.stats.regen || 0) + 0.6 * T.tier('liver')) * dt);
    T.fury = Math.max(0, T.fury - dt);
    T.grasp = Math.max(0, T.grasp - dt);
    Object.keys(T.cds).forEach(function (k) { T.cds[k] = Math.max(0, T.cds[k] - dt); });

    if (T.over) return;
    himWeapons(T, dt);
    stepEquipActive(T, dt);

      s.x += s.vx * dt; s.y += s.vy * dt; s.life -= dt;

    });

  }

  function toPrep(T) {

    T.drops = [];

    T.equip.forEach(function (e) { if (e.maxHp) e.hp = e.maxHp; e.cool = 0; });

  }

  function lureFor(T, e) {

      if (q.id !== 'decoy' || q.hp <= 0) return;

  }

  function moveEnemies(T, dt) {
    var h = T.him;

    var freezers = T.equip.filter(function (q) { return q.id === 'freezer'; });
    var walls = T.equip.filter(function (q) { return (q.id === 'barrier' || q.id === 'decoy') && q.hp > 0; });

        }
      } else if (dl > touch) {

      }

    }

  }

  function himWeapons(T, dt) {

  }

  /** 準備中でも動く装置(収集器・磁場・修復器) */

    var h = T.him;
    T.equip.forEach(function (q) {
      var d = EQUIP_BY_ID[q.id];
      if (q.id === 'collector') {
        var sp = d.speed * (1 + 0.12 * (q.lv - 1)) * dt;
        var best = null, bd = 0;
        T.drops.forEach(function (dr) { if (dr.got) return; var dd = d2(dr.x, dr.y, q.dx, q.dy); if (!best || dd < bd) { best = dr; bd = dd; } });
        var tx = best ? best.x : q.x, ty = best ? best.y : q.y;

      } else if (q.id === 'magnet') {

  }

  function stepEquipActive(T, dt) {
    var p = T.stats.power;
    T.equip.forEach(function (q) {
      var d = EQUIP_BY_ID[q.id];
      var L = lvMult(q.lv) * ampAt(T, q);
      q.timer = (q.timer || 0) - dt;
      if (q.id === 'turret') {

      } else if (q.id === 'mine') {

        q.cool = d.rearm * Math.pow(0.95, q.lv - 1);

  }

  /* ---------- 操作 ---------- */
  function setMove(T, x, y) { T.move.x = x; T.move.y = y; if (x || y) T.goal = null; }
  function setGoal(T, x, y) { T.goal = x === null ? null : { x: clamp(x, -0.97, 0.97), y: clamp(y, -0.97, 0.97) }; }

    var t = a.organ ? T.tier(a.organ) : 1;

    else if (id === 'pulse') { inRadius(T, h.x, h.y, 0.3, function (e) { hurt(T, e, 4 * t * P(T), 'pulse'); }); T.events.push({ type: 'ring', x: h.x, y: h.y, r: 0.3, src: 'pulse' }); }

    return true;
  }

  function placeCost(id) { return EQUIP_BY_ID[id].cost; }
  function canPlace(T, id, x, y) {
    if (T.phase !== 'prep' || T.over || !EQUIP_BY_ID[id] || !equipUnlocked(id, T.best)) return false;
    if (T.equip.length >= MAX_EQUIP || T.food < placeCost(id)) return false;
    if (Math.abs(x) > 0.95 || Math.abs(y) > 0.95) return false;
    return !T.equip.some(function (q) { return d2(q.x, q.y, x, y) < 0.07 * 0.07; });
  }
  function place(T, id, x, y) {
    if (!canPlace(T, id, x, y)) return null;
    var d = EQUIP_BY_ID[id];

    var q = { uid: T.nextId++, id: id, x: x, y: y, lv: 1, spent: d.cost, timer: 0 };
    if (id === 'collector') { q.dx = x; q.dy = y; }
