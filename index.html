    if (T.phase === 'collect') { g.fillStyle = 'rgba(184,162,122,.8)'; g.fillRect(0, H - 2, W * T.phaseT / 4, 2); }
  }

  function updateTrialHud() {
    var T = trial.run;
    if (!T || !$('trRound')) return;
    setText($('trRound'), String(T.round + (T.phase === 'prep' ? 1 : 0)));
    setText($('trPhase'), TL.phaseOf(Math.max(1, T.round)));
    setText($('trKills'), String(T.kills));
    setText($('trFood'), fmt(Math.floor(T.food)));
    setText($('trShards'), fmt(Math.floor(T.shards)));
    $('trHp').style.width = Math.max(0, T.him.hp / T.him.maxHp * 100) + '%';
    $('trEn').style.width = Math.max(0, T.him.energy / T.him.maxEnergy * 100) + '%';
    setText($('trHpN'), Math.ceil(T.him.hp) + '/' + Math.ceil(T.him.maxHp));
    setText($('trEnN'), Math.floor(T.him.energy) + '/' + Math.floor(T.him.maxEnergy));
    var bn = $('trBanner');
    setText(bn, trial.bannerT > 0 ? trial.banner : '');
    bn.classList.toggle('boss', trial.bannerBoss);
    TL.ACTIVES.forEach(function (a) {
      var b = document.querySelector('[data-act="' + a.id + '"]');
      if (!b) return;
      b.disabled = !TL.activeAvailable(T, a.id) || (T.cds[a.id] || 0) > 0 || T.him.energy < a.cost;
      var bar = b.querySelector('.cdb');
      if (bar) bar.style.width = ((T.cds[a.id] || 0) / a.cd * 100) + '%';
    });
    if (T.phase === 'prep') {
      Array.prototype.forEach.call(document.querySelectorAll('#trialBody [data-buy]'), function (b) { b.disabled = T.food < TL.placeCost(b.dataset.buy) || T.equip.length >= TL.MAX_EQUIP; });
      var ub = document.querySelector('#trialBody [data-up]');
      var q = trial.sel && TL.equipByUid(T, trial.sel);
      if (ub && q) ub.disabled = q.lv >= TL.MAX_LV || T.food < TL.upgradeCost(q);
    }
  }

  function canvasPoint(cv, ev) {
    var rect = cv.getBoundingClientRect();
    return { x: ((ev.clientX - rect.left) / rect.width) * 2 - 1, y: ((ev.clientY - rect.top) / rect.height) * 2 - 1 };
  }
  function bindCanvas(cv) {
    var down = false;
    cv.addEventListener('pointerdown', function (ev) {
      var T = trial.run;
      if (!T) return;
      var p = canvasPoint(cv, ev);
      if (T.phase === 'prep') {
        var hit = TL.equipAt(T, p.x, p.y);
        if (trial.pick && !hit) { TL.place(T, trial.pick, p.x, p.y); trial.built = false; renderTrial(true); return; }
        trial.sel = hit ? hit.uid : null; trial.pick = null; trial.built = false; renderTrial(true);
        return;
      }
      down = true;
      try { cv.setPointerCapture(ev.pointerId); } catch (e) { /* 何もしない */ }
      TL.setGoal(T, p.x, p.y);
    });
    cv.addEventListener('pointermove', function (ev) {
      var T = trial.run;
      if (!T) return;
      var p = canvasPoint(cv, ev);
      trial.ptr = p;
      if (down && T.phase !== 'prep') TL.setGoal(T, p.x, p.y);
    });
    function up() { down = false; if (trial.run) TL.setGoal(trial.run, null); }
    cv.addEventListener('pointerup', up);
    cv.addEventListener('pointercancel', up);
    cv.addEventListener('pointerleave', function () { trial.ptr = null; });
  }

  function prepControls(T) {
    var h = '<div class="tr-shop">';
    TL.EQUIP.forEach(function (d) {
      if (!TL.equipUnlocked(d.id, T.best)) return;
      h += '<button data-buy="' + d.id + '" class="' + (trial.pick === d.id ? 'on' : '') + '">' + esc(d.name) + '<small class="num">' + fmt(d.cost) + '</small></button>';
    });
    h += '</div>';
    var q = trial.sel && TL.equipByUid(T, trial.sel);
    if (q) {
      var d = TL.EQUIP_BY_ID[q.id];
      h += '<div class="tr-sel"><b>' + esc(d.name) + '</b> <span class="num">Lv' + q.lv + '</span>' +
        (q.lv < TL.MAX_LV ? '<button data-up="1">強化 <span class="num">' + fmt(TL.upgradeCost(q)) + '</span></button>' : '') +
        '<button data-sellq="1">売る <span class="num">+' + fmt(Math.floor(q.spent * 0.6)) + '</span></button></div>';
    }
    h += '<div class="tr-ctrl"><button data-next="1" class="go">第' + (T.round + 1) + 'ラウンドへ<small>Enter</small></button><button data-giveup="1">持ち帰る</button></div>';
    return h;
  }
  function fightControls(T) {
    var acts = TL.ACTIVES.filter(function (a) { return TL.activeAvailable(T, a.id); }).map(function (a) {
      return '<button data-act="' + a.id + '"><span class="k">' + ACT_KEYS[a.id] + '</span>' + esc(a.name) + '<small class="num">' + a.cost + '</small><i class="cdb"></i></button>';
    }).join('');
    return '<div class="tr-ctrl">' + acts + '</div>' +
      '<div class="tr-ctrl"><button data-speed="1">×' + trial.speed + '</button><button data-giveup="1">打ち切る</button></div>';
  }

  function renderTrial(force) {
    if (!C.trialUnlocked(state)) { setPanel('trialBody', ''); trial.built = false; return; }
    var T = trial.run;
    if (T) {
      var key = 'run:' + (T.phase === 'prep' ? 'prep' : 'fight');
      if (trial.built === key && !force) return;
      if (trial.built === key && force && T.phase !== 'prep') return;
      var keep = $('trialCanvas') && trial.built && trial.built.indexOf('run:') === 0;
      if (!keep) {
        setPanel('trialBody', '<div class="tr-wrap"><div class="tr-side">' +
          '<div class="tr-hud"><div>相<b id="trPhase"></b></div><div>ラウンド<b id="trRound"></b></div><div>撃破<b id="trKills"></b></div>' +
          '<div>養分<b id="trFood"></b></div><div>殻片<b id="trShards"></b></div><div></div>' +
          '<div>体力 <span id="trHpN" class="num"></span><div class="tr-bar"><i id="trHp" style="background:#8fa996"></i></div></div>' +
          '<div>気力 <span id="trEnN" class="num"></span><div class="tr-bar"><i id="trEn" style="background:#9fbdb8"></i></div></div><div></div></div>' +
          '<div class="tr-banner" id="trBanner"></div><div id="trCtrl"></div></div>' +
          '<canvas id="trialCanvas" width="320" height="320"></canvas></div>');
        bindCanvas($('trialCanvas'));
      }
      var ctrl = $('trCtrl');
      ctrl.innerHTML = T.phase === 'prep' ? prepControls(T) : fightControls(T);
      trial.built = key;
      updateTrialHud();
      return;
    }
    if (trial.built === 'idle' && !force) return;
    trial.built = 'idle';
    var h = '';
    if (trial.result) {
      var r = trial.result;
      h += '<div class="tr-result howto"><div class="big">' + r.cleared + '</div><p>' + esc(r.phase) + ' / 撃破 ' + r.kills + '</p>' +
        '<p>殻片 <b class="num">+' + fmt(r.shards) + '</b></p><button data-again="1">戻る</button></div>';
      setPanel('trialBody', h);
      return;
    }
    var st = C.trialStats(state, state.cells * trial.invest);
    var abil = Object.keys(st.organs).filter(function (k) { return st.organs[k] > 0; }).map(function (k) { return ORGAN_ABILITY[k] + ' ' + st.organs[k]; });
    h += '<div class="tr-start">';
    h += '<div class="howto"><p class="num">攻撃 ' + st.power.toFixed(1) + ' / 体力 ' + Math.round(st.hp) + ' / 養分 ' + fmt(st.food0) + '</p>' +
      (abil.length ? '<p class="hint">' + abil.map(esc).join(' / ') + '</p>' : '') + '</div>';
    h += '<div class="seg-row"><div class="seg">' + [0, 0.25, 0.5, 1].map(function (f) { return '<button data-invest="' + f + '" class="' + (trial.invest === f ? 'active' : '') + '">' + (f * 100) + '%</button>'; }).join('') + '</div>' +
      '<span class="hint num">' + fmt(state.cells * trial.invest) + '</span></div>';
    h += '<button class="btn" data-start="1" style="padding:10px;font-size:14px">耐用試験を始める</button>';
    if (state.trial.runs) h += '<div class="tr-hist">最高 ' + state.trial.best + 'ラウンド<br>' +
      state.trial.history.map(function (x) { return x.cleared + 'ラウンド 殻片+' + fmt(x.shards); }).join('<br>') + '</div>';
    h += '</div>';
    setPanel('trialBody', h);
  }

  /* ============================================================
   * 樹の画面(canvas)。ui.js の中に差し込まれる
   * ========================================================== */
  var TRE = C.TR;
  var tview = { x: 0, y: 80, z: 1, sel: null, built: false, drag: null, revealT: 0, centered: false };
  var newShards = false;
  var ROMAN = ['', 'Ⅰ', 'Ⅱ', 'Ⅲ', 'Ⅳ', 'Ⅴ', 'Ⅵ', 'Ⅶ', 'Ⅷ', 'Ⅸ', 'Ⅹ'];

  function treeScreen(cv, n) {
    return [cv.width / 2 + (n.x - tview.x) * tview.z, cv.height / 2 + (n.y - tview.y) * tview.z];
  }

  function drawTree(now) {
    var cv = $('treeCanvas');
    if (!cv) return;
    var rect = cv.getBoundingClientRect();
    var dpr = 0.42;   // わざと粗く
    var W = Math.max(200, Math.round(rect.width * dpr)), H = Math.max(200, Math.round(rect.height * dpr));
    if (cv.width !== W || cv.height !== H) { cv.width = W; cv.height = H; }
    var g = cv.getContext('2d');
    g.setTransform(1, 0, 0, 1, 0, 0);
    g.clearRect(0, 0, W, H);
    var z = tview.z * dpr;
    var tx = function (n) { return [W / 2 + (n.x - tview.x) * z, H / 2 + (n.y - tview.y) * z]; };
    var owned = state.tree.owned;
    var vis = TRE.visibility(owned);
    var rev = C.treeRevealed(state);
    var t = (now || performance.now()) / 1000;
    // 明かされたら、球と道を薄く全部見せる
    if (rev) {
      g.strokeStyle = 'rgba(163,128,143,.18)'; g.lineWidth = 14 * z;
      TRE.PATHS.forEach(function (p) {
        var a = tx(TRE.SPHERE_BY_ID[p[0]]), b = tx(TRE.SPHERE_BY_ID[p[1]]);
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      });
    }
    // つながり
    TRE.NODES.forEach(function (n) {
      var vn = vis[n.id] || (rev ? 'seen' : null);
      if (!vn) return;
      var a = tx(n);
      TRE.ADJ[n.id].forEach(function (mid) {
        if (mid < n.id) return;
        var vm = vis[mid] || (rev ? 'seen' : null);
        if (!vm) return;
        var b = tx(TRE.NODE_BY_ID[mid]);
        var both = owned[n.id] && owned[mid];
        var fog = vn === 'fog' || vm === 'fog' || vn === 'seen' || vm === 'seen';
        g.strokeStyle = both ? 'rgba(163,128,143,.85)' : fog ? 'rgba(159,189,184,.10)' : 'rgba(159,189,184,.4)';
        g.lineWidth = both ? 2 * dpr : 1 * dpr;
        g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(b[0], b[1]); g.stroke();
      });
    });
    // 節
    g.textAlign = 'center';
    TRE.NODES.forEach(function (n) {
      var v = vis[n.id] || (rev ? 'seen' : null);
      if (!v) return;
      var p = tx(n);
      var key = n.kind === 'key';
      var r = (key ? 13 : n.kind === 'ring' ? 6 : 5) * z;
      if (v === 'fog') { g.fillStyle = 'rgba(159,189,184,.18)'; g.beginPath(); g.arc(p[0], p[1], Math.max(1.5, r * 0.4), 0, Math.PI * 2); g.fill(); return; }
      var own = !!owned[n.id];
      var can = v === 'open' && state.tree.shards >= TRE.cost(n.id);
      if (own) {
        var gl = g.createRadialGradient(p[0], p[1], 0, p[0], p[1], r * 2.4);
        gl.addColorStop(0, key ? 'rgba(163,128,143,.6)' : 'rgba(163,128,143,.35)'); gl.addColorStop(1, 'rgba(163,128,143,0)');
        g.fillStyle = gl; g.beginPath(); g.arc(p[0], p[1], r * 2.4, 0, Math.PI * 2); g.fill();
        g.fillStyle = key ? '#c4a7b3' : '#a3808f';
        g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2); g.fill();
      } else {
        g.strokeStyle = v === 'seen' ? 'rgba(159,189,184,.25)' : can ? 'rgba(159,189,184,' + (0.6 + 0.4 * Math.sin(t * 4)) + ')' : 'rgba(159,189,184,.55)';
        g.lineWidth = (can ? 2 : 1) * dpr;
        g.fillStyle = 'rgba(16,17,17,.9)';
        g.beginPath(); g.arc(p[0], p[1], r, 0, Math.PI * 2); g.fill(); g.stroke();
      }
      if (!own && v === 'open') { g.fillStyle = can ? 'rgba(214,216,210,.85)' : 'rgba(135,139,134,.7)'; g.font = Math.max(6, 8 * z) + 'px DotGothic16, monospace'; g.textAlign = 'center'; g.fillText(fmt(TRE.cost(n.id)), p[0], p[1] + r + Math.max(6, 9 * z)); }
      if (tview.sel === n.id) { g.strokeStyle = '#b8a27a'; g.lineWidth = 2 * dpr; g.beginPath(); g.arc(p[0], p[1], r + 5 * dpr, 0, Math.PI * 2); g.stroke(); }
      if (key && (own || v === 'open' || rev)) {
        var s = TRE.SPHERE_BY_ID[n.id];
        g.fillStyle = own ? '#fff' : 'rgba(159,189,184,.8)';
        g.font = Math.max(7, 11 * z) + 'px DotGothic16, monospace';
        g.fillText(ROMAN[s.no], p[0], p[1] + 4 * z);
      }
    });
  }

  function treeLoop(now) { if (shown('tree')) drawTree(now); requestAnimationFrame(treeLoop); }
  requestAnimationFrame(treeLoop);

  function treeHit(cv, ev) {
    var rect = cv.getBoundingClientRect();
    var mx = ev.clientX - rect.left, my = ev.clientY - rect.top;
    var vis = TRE.visibility(state.tree.owned);
    var rev = C.treeRevealed(state);
    var best = null, bd = 16 * 16;
    TRE.NODES.forEach(function (n) {
      var v = vis[n.id] || (rev ? 'seen' : null);
      if (!v || v === 'fog') return;
      var x = rect.width / 2 + (n.x - tview.x) * tview.z, y = rect.height / 2 + (n.y - tview.y) * tview.z;
      var d = (x - mx) * (x - mx) + (y - my) * (y - my);
      if (d < bd) { bd = d; best = n.id; }
    });
    return best;
  }

  function bindTreeCanvas() {
    var cv = $('treeCanvas');
    if (!cv || cv.__bound) return;
    cv.__bound = true;
    var moved = false;
    cv.addEventListener('pointerdown', function (ev) {
      tview.drag = { x: ev.clientX, y: ev.clientY, vx: tview.x, vy: tview.y };
      moved = false;
      cv.setPointerCapture(ev.pointerId);
    });
    cv.addEventListener('pointermove', function (ev) {
      if (!tview.drag) return;
      var dx = ev.clientX - tview.drag.x, dy = ev.clientY - tview.drag.y;
      if (Math.abs(dx) + Math.abs(dy) > 4) moved = true;
      tview.x = tview.drag.vx - dx / tview.z; tview.y = tview.drag.vy - dy / tview.z;
    });
    cv.addEventListener('pointerup', function (ev) {
      if (!moved) { var id = treeHit(cv, ev); if (id) { tview.sel = id; htmlCache = {}; renderTreeSel(); } }
      tview.drag = null;
    });
    cv.addEventListener('wheel', function (ev) {
      ev.preventDefault();
      tview.z = Math.max(0.35, Math.min(2.5, tview.z * (ev.deltaY < 0 ? 1.1 : 0.9)));
    }, { passive: false });
  }

  $('win-tree').addEventListener('click', function (ev) {
    var b = ev.target.closest('button');
    if (!b) return;
    if (b.dataset.buy) {
      var id = b.dataset.buy;
      if (C.buyNode(state, id)) {
        var n = TRE.NODE_BY_ID[id];
        if (n.kind === 'key') toast(n.text, 'dark');
      }
    } else if (b.dataset.zoom) tview.z = Math.max(0.35, Math.min(2.5, tview.z * Number(b.dataset.zoom)));
    else if (b.dataset.home) { tview.x = 0; tview.y = 80; tview.z = 1; }
    else return;
    htmlCache = {};
    renderTree(true);
  });

  function renderTreeSel() {
    var id = tview.sel;
    var el = $('treeSel');
    if (!el) return;
    if (!id) { setPanel('treeSel', ''); return; }
    var n = TRE.NODE_BY_ID[id];
    var own = state.tree.owned[id];
    var can = TRE.canBuy(state.tree.owned, id);
    var c = TRE.cost(id);
    var s = n.sphere ? TRE.SPHERE_BY_ID[n.sphere] : null;
    var rev = C.treeRevealed(state);
    var h = n.kind === 'key' ? '<div class="t">' + ROMAN[s.no] + '</div>' : '';
    h += '<div>' + esc(n.label) + '</div>';
    if (n.text) h += '<div class="q">' + esc(n.text) + '</div>';
    if (!own && can) h += '<button data-buy="' + id + '"' + (state.tree.shards < c ? ' disabled' : '') + '>殻片 <span class="num">' + fmt(c) + '</span> で開く</button>';
    setPanel('treeSel', h);
  }

  function renderTree(force) {
    var rev = C.treeRevealed(state);
    if (!$('treeCanvas')) {
      setPanel('treeBody', '<div class="tree-top"><span>殻片 <b id="treeShards" class="num"></b> <span class="hint num" id="treeNext"></span></span><span class="seg"><button data-zoom="1.2">拡大</button><button data-zoom="0.83">縮小</button><button data-home="1">始まりへ</button></span></div>' +
        '<div id="treeView"><canvas id="treeCanvas"></canvas></div><div class="tree-sel" id="treeSel"></div>');
      bindTreeCanvas();
    }
    setText($('treeShards'), fmt(state.tree.shards));
    var nc = C.nextNodeCost(state);
    setText($('treeNext'), nc ? '次 ' + fmt(nc) : '');
    renderTreeSel();
  }


  /* ---------- まとめて描く ---------- */
  var lastSlow = 0;
  var bpSeenUnlock = false;
  var lastTrialIdle = 0, lastLog = 0;
  function render(force) {
    var t = performance.now();
    var rates = C.computeRates(state);
    renderTop(rates);
    renderMiddle();
    updateNavLocks();
    if (shown('fac')) renderFacilities(rates);
    if (shown('upg')) renderUpgrades();
    if (shown('drug')) renderDrugs();
    if (shown('bp') && (force || t - lastSlow > 500)) { renderBlueprint(); lastSlow = t; }
    if (shown('codex') && (force || t - lastSlow > 1000)) { renderCodex(); lastSlow = t; }
    if (shown('rec') && (force || t - lastSlow > 1000)) { renderWave(); renderStats(); lastSlow = t; }
    if (shown('grade')) renderGrade();
    if (shown('trial') && (force || trial.run || t - lastTrialIdle > 1000)) { renderTrial(force || (!trial.run && t - lastTrialIdle > 1000)); lastTrialIdle = t; }
    if (shown('tree')) renderTree(force);
    if (shown('log') && (force || t - lastLog > 1000)) { renderLog(); lastLog = t; }
    setDot('upg', anyUpgradeBuyable() || newCard);
    setDot('bp', C.bpUnlocked(state) && !bpSeenUnlock);
    setDot('codex', newPage || newGuide);
    setDot('grade', C.promotionUnits(state) > 0);
    setDot('trial', C.trialUnlocked(state) && state.trial.runs === 0);
    setDot('tree', newShards || TRE.NODES.some(function (n) { return TRE.canBuy(state.tree.owned, n.id) && state.tree.shards >= TRE.cost(n.id); }));
    setDot('log', newLog);
    ['fac', 'drug', 'rec'].forEach(function (id) { setDot(id, false); });
  }

  /* ---------- 出来事の知らせ ---------- */
  var prev = null;
  function watchEvents() {
    var cur = {
      crash: state.crashLeft > 0, refr: state.refractoryLeft > 0, stage: C.stageOf(state.totalCells).name,
      hs: C.heatStage(state.heat), win: C.criticalWindow(state, Date.now()).open, canPromote: C.promotionUnits(state) > 0,
      promotions: state.promotions, zones: C.openZoneCount(state), bp: C.bpUnlocked(state),
    };
    if (prev && prev.promotions === cur.promotions) {
      if (cur.crash && !prev.crash) toast('暴走', 'red');
      if (cur.stage !== prev.stage) toast(cur.stage, '');
      if (cur.hs === 2 && prev.hs < 2 && !cur.crash) toast('過熱', 'red');
      if (cur.win && !prev.win) toast('臨界期', '');
      if (cur.canPromote && !prev.canPromote) toast('継代', '');
      if (cur.bp && !prev.bp) toast('設計図', 'gold');
      if (cur.zones > prev.zones && prev.bp) toast('区画', 'gold');
    }
    prev = cur;
  }
  function handleEvents(events) {
    events.forEach(function (e) {
      if (e.type === 'card') { var c = CT.CARD_BY_ID[e.id]; toast(c.name, c.dark ? 'dark' : 'gold'); newCard = true; pushLog('event', 'カード', c.name); }
      else if (e.type === 'page') { var p = CT.PAGE_BY_ID[e.id]; toast('第' + p.no + '頁', p.kind === 'final' ? 'dark' : 'gold'); newPage = true; pushLog('event', '写本 第' + p.no + '頁', p.text); }
      else if (e.type === 'seal') { toast('封印', 'dark'); }
      else if (e.type === 'qliphoth') { newShards = true; }
      else if (e.type === 'ending') showEnding();
    });
  }

  /* ---------- 結末 ---------- */
  function showEnding() {
    var box = $('ending');
    startEndingHolo();
    $('endingLines').innerHTML = CT.ENDING.map(function (l, i) { return '<p style="animation-delay:' + (i * 2.2) + 's">' + esc(l) + '</p>'; }).join('');
    $('endingOk').style.animationDelay = (CT.ENDING.length * 2.2 + 1) + 's';
    box.classList.add('show');
    state.story.endingShown = true;
    save();
  }
  $('endingOk').addEventListener('click', function () { $('ending').classList.remove('show'); stopEndingHolo(); render(true); });

  /* ---------- 彼の声 ---------- */
  function showHim(text) {
    var el = $('him');
    el.textContent = text;
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
  }

  /* ---------- 時間を進める ---------- */
  var lastT = performance.now();
  var lastCheck = 0;
  function loop() {
    var t = performance.now();
    var dt = (t - lastT) / 1000;
    lastT = t;
    if (dt > 60) {
      state.lastSavedMs = Date.now() - dt * 1000;
      showWelcome(C.catchUp(state, Date.now()));
    } else {
      while (dt > 0) { var d = Math.min(1, dt); C.tick(state, d); dt -= d; }
    }
    if (!state.voice && state.nextVoiceIn <= 0) { var vv = C.spawnVoice(state); if (vv) pushLog('voice', vv.name, vv.text); }
    if (!state.him && state.nextHimIn <= 0) { var h = C.spawnHim(state); if (h) { showHim(h.text); pushLog('him', '', h.text); } }
    if (t - lastCheck > 1000) { lastCheck = t; handleEvents(C.checkProgress(state, { sessionSeconds: sessionSeconds() })); }
    if (t - lastWave > 2000) { lastWave = t; recordWave(); }
    watchEvents();
  }

  setInterval(loop, 100);
  setInterval(function () { render(false); }, 200);
  setInterval(save, 10000);
  document.addEventListener('visibilitychange', function () { if (document.hidden) save(); });
  window.addEventListener('pagehide', save);
  recordWave();
  render(true);
  if (state.story.cleared && !state.story.endingShown) showEnding();

  // テスト用の入り口(画面からは使わない)
  window.__game = { get state() { return state; }, render: render, save: save, showHim: showHim, handleEvents: handleEvents, disableSave: function () { saveDisabled = true; }, trial: function () { return trial.run; } };
})();

</script>
</body>
</html>
